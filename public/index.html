<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צ'אט קבוצתי מתקדם</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        @media (min-width: 601px) {
            .container {
                height: 90vh;
                border-radius: 10px;
            }
        }
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 20px;
            text-align: center;
        }
        #login-screen input {
            padding: 12px;
            font-size: 16px;
            width: 80%;
            max-width: 300px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #login-screen button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #chat-screen {
            display: none;
            flex-direction: column;
            flex: 1;
            height: 100%;
            position: relative;
        }
        header {
            background-color: #0084ff;
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }
        #chat-title {
            margin: 0;
            cursor: pointer;
            user-select: none;
            font-size: 16px;
        }
        .chat-messages-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: #f7f9fa;
        }
        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 75%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            word-break: break-word;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .message.my-message {
            background: #dcf8c6;
            align-self: flex-end;
        }
        .message.system {
            background: #e4e6eb;
            color: #65676b;
            align-self: center;
            font-size: 13px;
            text-align: center;
            max-width: 100%;
            box-shadow: none;
        }
        .badge {
            background: #ff9800;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
            font-weight: bold;
        }
        .quoted-box {
            background: rgba(0, 0, 0, 0.05);
            border-right: 4px solid #0084ff;
            padding: 5px 8px;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 12px;
            color: #444;
        }
        .msg-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #777;
            margin-top: 4px;
        }
        .msg-menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            color: #555;
            position: absolute;
            top: 5px;
            left: 5px;
        }
        .read-receipt { font-size: 12px; font-weight: bold; }
        .read-receipt.blue { color: #0084ff; }
        .read-receipt.gray { color: gray; }

        .reactions-container {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .reaction-badge {
            background: white;
            border: 1px solid #ddd;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            position: relative;
        }
        .reaction-badge:hover { background: #f0f0f0; }
        .reaction-tooltip {
            display: none;
            position: absolute;
            bottom: 25px;
            right: 0;
            background: #333;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 20;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .reaction-badge:hover .reaction-tooltip { display: block; }

        #reply-preview-container {
            display: none;
            background: #f0f2f5;
            padding: 8px 15px;
            border-top: 1px solid #ddd;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        #reply-preview-content {
            border-right: 4px solid #0084ff;
            padding-right: 8px;
            flex: 1;
            color: #333;
        }
        #cancel-reply-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #666;
        }

        #scroll-bottom-btn {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #scroll-bottom-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #e53935;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 50%;
            font-weight: bold;
            display: none;
        }

        #typing-indicator {
            padding: 2px 15px;
            font-size: 12px;
            color: #666;
            background: #f7f9fa;
            height: 18px;
            font-weight: bold;
        }

        #chat-form {
            display: flex;
            align-items: center;
            padding: 8px;
            background: white;
            border-top: 1px solid #ddd;
            gap: 5px;
            flex-shrink: 0;
        }
        #chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
        }
        #chat-form button {
            padding: 10px 15px;
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #sidebar {
            position: absolute;
            top: 0;
            right: -100%;
            width: 85%;
            max-width: 320px;
            height: 100%;
            background: white;
            box-shadow: -2px 0 5px rgba(0,0,0,0.2);
            transition: right 0.3s ease;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }
        #sidebar.open { right: 0; }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 6px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        #sidebar-content {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .menu-action-btn {
            background-color: #0084ff;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            width: 100%;
        }
        .user-mgmt-item, .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 4px;
            gap: 4px;
            border: 1px solid #eee;
        }
        .online-status { color: #4caf50; font-weight: bold; }
        .offline-status { color: #888; }
        .leave-btn {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 6px;
            text-align: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .msg-dropdown {
            display: none;
            position: absolute;
            top: 25px;
            left: 5px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 50;
            min-width: 150px;
        }
        .msg-dropdown button {
            display: block;
            width: 100%;
            padding: 8px;
            background: none;
            border: none;
            text-align: right;
            cursor: pointer;
            font-size: 13px;
        }
        .msg-dropdown button:hover { background: #f0f0f0; }
        .emoji-picker-row {
            display: flex;
            justify-content: space-around;
            padding: 6px;
            border-bottom: 1px solid #eee;
            background: #fafafa;
        }
        .emoji-picker-row span { cursor: pointer; font-size: 16px; }
        
        #ban-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .ban-modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-screen">
            <h2>ברוכים הבאים לצ'אט</h2>
            <p>בחר כינוי כדי להיכנס לשיחה:</p>
            <input type="text" id="nickname-input" placeholder="הכנס כינוי...">
            <br>
            <button id="login-btn">הכנס לצ'אט</button>
        </div>

        <div id="chat-screen">
            <header>
                <button class="menu-btn" id="menu-toggle">☰</button>
                <h3 id="chat-title">צ'אט קבוצתי</h3>
                <div style="display:flex; align-items:center; gap:5px;">
                    <span id="user-display" style="font-size: 13px;"></span>
                    <button onclick="editNickname()" title="שנה כינוי" style="background:none; border:none; color:white; cursor:pointer; font-size:14px;">✏️</button>
                </div>
            </header>

            <div id="sidebar">
                <div class="sidebar-header">
                    <h4 style="margin:0;" id="sidebar-title">תפריט</h4>
                    <button id="close-sidebar" style="background:none;border:none;font-size:18px;cursor:pointer;">✕</button>
                </div>
                <div id="sidebar-content"></div>
                <button class="leave-btn" onclick="leaveChat()">עזוב קבוצה</button>
            </div>

            <div class="chat-messages-wrapper">
                <div id="chat-messages"></div>
                <button id="scroll-bottom-btn">↓<span id="scroll-bottom-badge">0</span></button>
            </div>

            <div id="typing-indicator"></div>

            <div id="reply-preview-container">
                <div id="reply-preview-content"></div>
                <button id="cancel-reply-btn" onclick="cancelReply()">✕</button>
            </div>

            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="כתוב הודעה..." autocomplete="off">
                <button type="submit">שלח</button>
            </form>
        </div>
    </div>

    <div id="ban-modal">
        <div class="ban-modal-content">
            <h4 style="margin:0 0 10px 0;">בחר משך חסימה</h4>
            <select id="ban-duration-select">
                <option value="1h">שעה אחת</option>
                <option value="24h">יום אחד</option>
            </select>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
                <button onclick="closeBanModal()" style="background:#ccc; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">ביטול</button>
                <button onclick="confirmBanUser()" style="background:#e53935; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">חסום</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const nicknameInput = document.getElementById('nickname-input');
        const loginBtn = document.getElementById('login-btn');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');
        const userDisplay = document.getElementById('user-display');
        const scrollBottomBtn = document.getElementById('scroll-bottom-btn');
        const scrollBottomBadge = document.getElementById('scroll-bottom-badge');
        const typingIndicator = document.getElementById('typing-indicator');
        
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const closeSidebar = document.getElementById('close-sidebar');
        const sidebarContent = document.getElementById('sidebar-content');
        const sidebarTitle = document.getElementById('sidebar-title');
        const chatTitle = document.getElementById('chat-title');
        
        const replyPreviewContainer = document.getElementById('reply-preview-container');
        const replyPreviewContent = document.getElementById('reply-preview-content');

        let currentNickname = localStorage.getItem('chat_nickname') || '';
        let isUserAdmin = localStorage.getItem('chat_is_admin') === 'true';
        let currentRoomId = 'public';
        let globalUsers = [];
        let globalRooms = {};
        let activeMessagesData = [];
        let unreadScrolledCount = 0;
        let isUserScrolledUp = false;
        let currentReplyingTo = null;

        if (currentNickname) {
            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            userDisplay.innerText = currentNickname;
            socket.emit('join', { nickname: currentNickname, isAdmin: isUserAdmin });
        }

        loginBtn.addEventListener('click', () => {
            const nick = nicknameInput.value.trim();
            if (!nick) { alert('אנא הכנס כינוי תקין'); return; }
            currentNickname = nick;
            localStorage.setItem('chat_nickname', currentNickname);
            socket.emit('join', { nickname: currentNickname, isAdmin: isUserAdmin });
            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            userDisplay.innerText = currentNickname;
        });

        function editNickname() {
            let newNick = prompt('הכנס כינוי חדש:', currentNickname);
            if (newNick && newNick.trim() !== '') {
                currentNickname = newNick.trim();
                localStorage.setItem('chat_nickname', currentNickname);
                userDisplay.innerText = currentNickname;
                socket.emit('join', { nickname: currentNickname, isAdmin: isUserAdmin });
                alert('הכינוי עודכן בהצלחה!');
            }
        }

        chatMessages.addEventListener('scroll', () => {
            const threshold = 60;
            const position = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
            isUserScrolledUp = position > threshold;
            if (!isUserScrolledUp) {
                unreadScrolledCount = 0;
                scrollBottomBtn.style.display = 'none';
                scrollBottomBadge.style.display = 'none';
            }
        });

        scrollBottomBtn.addEventListener('click', () => {
            chatMessages.scrollTop = chatMessages.scrollHeight;
            unreadScrolledCount = 0;
            scrollBottomBtn.style.display = 'none';
            scrollBottomBadge.style.display = 'none';
        });

        let typingTimeout;
        chatInput.addEventListener('input', () => {
            socket.emit('typing', true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { socket.emit('typing', false); }, 1000);
        });

        socket.on('user-typing', (data) => {
            typingIndicator.innerText = data.isTyping ? `${data.nickname} מקליד/ה...` : '';
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (text !== '') {
                if (text === '1234') {
                    socket.emit('verify-admin', '1234');
                    chatInput.value = '';
                    socket.emit('typing', false);
                    return;
                }

                socket.emit('chat-message', { 
                    nickname: currentNickname, 
                    text: text, 
                    type: 'text',
                    replyTo: currentReplyingTo ? { id: currentReplyingTo.id, nickname: currentReplyingTo.nickname, text: currentReplyingTo.text } : null
                });
                chatInput.value = '';
                cancelReply();
                socket.emit('typing', false);
            }
        });

        menuToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
        closeSidebar.addEventListener('click', () => sidebar.classList.remove('open'));

        let lastClickTime = 0;
        chatTitle.addEventListener('click', () => {
            if (isUserAdmin) return;
            let currentTime = new Date().getTime();
            if (currentTime - lastClickTime < 400) {
                let password = prompt('הכנס סיסמת מנהל:');
                if (password !== null) socket.emit('verify-admin', password.trim());
            }
            lastClickTime = currentTime;
        });

        socket.on('admin-success', (success) => {
            if (success) {
                isUserAdmin = true;
                localStorage.setItem('chat_is_admin', 'true');
                alert('התחברת בהצלחה כמנהל!');
                socket.emit('join', { nickname: currentNickname, isAdmin: true });
            } else {
                alert('סיסמה שגויה!');
            }
        });

        function createPrivateChatWithUser(targetUser) {
            let roomName = prompt(`איך תרצה לקרוא לצ'אט האישי עם ${targetUser}?`, `צ'אט עם ${targetUser}`);
            if (!roomName || !roomName.trim()) return;
            socket.emit('create-private-room', { roomName: roomName.trim(), targetNickname: targetUser });
        }

        socket.on('room-created', (roomId) => {
            let roomObj = globalRooms[roomId];
            switchToRoom(roomId, roomObj ? roomObj.name : 'צ\'אט אישי');
        });

        function switchToRoom(roomId, roomTitle) {
            currentRoomId = roomId;
            let finalTitle = roomTitle;
            if ((!finalTitle || finalTitle === 'undefined') && globalRooms[roomId]) {
                finalTitle = globalRooms[roomId].name;
            }
            chatTitle.innerText = finalTitle || (roomId === 'public' ? 'צ\'אט קבוצתי' : 'צ\'אט אישי');
            sidebar.classList.remove('open');
            socket.emit('switch-room', roomId);
        }

        socket.on('room-deleted-by-admin', (roomId) => {
            if (currentRoomId === roomId) {
                alert('הצ\'אט הזה נמחק.');
                switchToRoom('public', 'צ\'אט קבוצתי');
            }
        });

        socket.on('load-messages', (msgs) => {
            activeMessagesData = msgs;
            chatMessages.innerHTML = '';
            msgs.forEach(data => appendMessage(data, false));
            chatMessages.scrollTop = chatMessages.scrollHeight;
            socket.emit('mark-as-read');
        });

        socket.on('new-message', (data) => {
            activeMessagesData.push(data);
            appendMessage(data, true);
        });

        socket.on('update-messages-status', (msgs) => {
            activeMessagesData = msgs;
            msgs.forEach(data => {
                const div = document.getElementById(data.id);
                if (div) {
                    const receipt = div.querySelector('.read-receipt');
                    if (receipt) {
                        receipt.className = `read-receipt ${data.isAllRead ? 'blue' : 'gray'}`;
                        receipt.innerText = data.isAllRead ? '✓✓' : '✓';
                    }
                }
            });
        });

        socket.on('message-deleted', (messageId) => {
            activeMessagesData = activeMessagesData.filter(m => m.id !== messageId);
            const div = document.getElementById(messageId);
            if (div) div.remove();
        });

        socket.on('message-reaction-updated', (data) => {
            const msg = activeMessagesData.find(m => m.id === data.messageId);
            if (msg) {
                msg.reactions = data.reactions;
                updateMessageReactionsDOM(data.messageId, msg.reactions);
            }
        });

        socket.on('banned', (reason) => {
            alert('הושתה עליך חסימה ממערכת הצ\'אט: ' + (reason || 'אין כניסה.'));
            localStorage.clear();
            window.location.reload();
        });

        function appendMessage(data, shouldScrollCheck) {
            if (data.system) {
                const div = document.createElement('div');
                div.className = 'message system';
                div.innerText = data.text;
                chatMessages.appendChild(div);
                handleScrollAfterAppend(shouldScrollCheck);
                return;
            }

            const div = document.createElement('div');
            div.className = `message ${data.nickname === currentNickname ? 'my-message' : ''}`;
            div.id = data.id;

            let badgeHtml = data.role ? `<span class="badge">${data.role}</span>` : '';
            let isMyMsg = data.nickname === currentNickname;
            let canDelete = isMyMsg || isUserAdmin;

            let quotedHtml = '';
            if (data.replyTo) {
                quotedHtml = `<div class="quoted-box"><strong>${data.replyTo.nickname}:</strong> ${data.replyTo.text}</div>`;
            }

            let timeString = data.time || '';

            div.innerHTML = `
                <button class="msg-menu-btn" onclick="toggleMsgMenu('${data.id}')">⋮</button>
                <div class="msg-dropdown" id="dropdown-${data.id}">
                    <div class="emoji-picker-row">
                        <span onclick="addReaction('${data.id}', '👍')">👍</span>
                        <span onclick="addReaction('${data.id}', '❤️')">❤️</span>
                        <span onclick="addReaction('${data.id}', '😂')">😂</span>
                        <span onclick="addReaction('${data.id}', '😮')">😮</span>
                        <span onclick="addReaction('${data.id}', '😢')">😢</span>
                    </div>
                    <button onclick="startReply('${data.id}')">השב (ציטוט)</button>
                    ${canDelete ? `<button onclick="deleteMessage('${data.id}')" style="color:red;">מחק</button>` : ''}
                </div>
                ${quotedHtml}
                <strong>${badgeHtml}${data.nickname}:</strong>
                <span class="msg-text">${data.text}</span>
                <div class="reactions-container" id="reactions-${data.id}"></div>
                <div class="msg-footer">
                    <span>${timeString}</span>
                    <span class="read-receipt ${data.isAllRead ? 'blue' : 'gray'}">${data.isAllRead ? '✓✓' : '✓'}</span>
                </div>
            `;

            let touchStartX = 0;
            div.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
            div.addEventListener('touchend', (e) => {
                let touchEndX = e.changedTouches[0].clientX;
                if (touchEndX - touchStartX > 50) {
                    startReply(data.id);
                }
            });

            chatMessages.appendChild(div);
            updateMessageReactionsDOM(data.id, data.reactions || {});
            handleScrollAfterAppend(shouldScrollCheck);
            socket.emit('mark-as-read');
        }

        function updateMessageReactionsDOM(msgId, reactionsObj) {
            const container = document.getElementById(`reactions-${msgId}`);
            if (!container) return;
            container.innerHTML = '';
            
            let emojiToNames = {};
            for (let nick in reactionsObj) {
                let emoji = reactionsObj[nick];
                if (!emojiToNames[emoji]) emojiToNames[emoji] = [];
                emojiToNames[emoji].push(nick);
            }

            for (let emoji in emojiToNames) {
                let namesList = emojiToNames[emoji].join(', ');
                const badge = document.createElement('div');
                badge.className = 'reaction-badge';
                badge.innerHTML = `${emoji} <span>${emojiToNames[emoji].length}</span><div class="reaction-tooltip">${namesList}</div>`;
                container.appendChild(badge);
            }
        }

        function addReaction(msgId, emoji) {
            socket.emit('reaction-message', { messageId: msgId, emoji: emoji });
            toggleMsgMenu(msgId);
        }

        function startReply(msgId) {
            const msg = activeMessagesData.find(m => m.id === msgId);
            if (!msg) return;
            currentReplyingTo = msg;
            replyPreviewContent.innerHTML = `<strong>משיב ל-${msg.nickname}:</strong> ${msg.text}`;
            replyPreviewContainer.style.display = 'flex';
            chatInput.focus();
            toggleMsgMenu(msgId);
        }

        function cancelReply() {
            currentReplyingTo = null;
            replyPreviewContainer.style.display = 'none';
            replyPreviewContent.innerHTML = '';
        }

        function handleScrollAfterAppend(shouldScrollCheck) {
            if (!shouldScrollCheck) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return;
            }
            if (isUserScrolledUp) {
                unreadScrolledCount++;
                scrollBottomBtn.style.display = 'flex';
                scrollBottomBadge.style.display = 'inline-block';
                scrollBottomBadge.innerText = unreadScrolledCount;
            } else {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function toggleMsgMenu(msgId) {
            document.querySelectorAll('.msg-dropdown').forEach(d => {
                if (d.id !== `dropdown-${msgId}`) d.style.display = 'none';
            });
            const menu = document.getElementById(`dropdown-${msgId}`);
            if (menu) menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function deleteMessage(msgId) {
            if (confirm('האם למחוק הודעה זו?')) {
                socket.emit('delete-message', msgId);
            }
            toggleMsgMenu(msgId);
        }

        socket.on('update-data', (data) => {
            let uniqueUsersMap = {};
            (data.allUsers || []).forEach(u => {
                uniqueUsersMap[u.nickname] = u;
            });
            globalUsers = Object.values(uniqueUsersMap);
            globalRooms = data.privateRooms || {};
            
            sidebarContent.innerHTML = '';

            if (currentRoomId !== 'public') {
                const backBtn = document.createElement('button');
                backBtn.className = 'menu-action-btn';
                backBtn.style.backgroundColor = '#607d8b';
                backBtn.innerText = '⬅️ חזרה לצ\'אט הראשי';
                backBtn.onclick = () => switchToRoom('public', 'צ\'אט קבוצתי');
                sidebarContent.appendChild(backBtn);
            }

            if (isUserAdmin) {
                sidebarTitle.innerText = "פאנל ניהול סודי 🛡️";

                // 1. כפתור ניקוי הצ'אט - הכי למעלה
                const clearChatBtn = document.createElement('button');
                clearChatBtn.className = 'menu-action-btn';
                clearChatBtn.style.backgroundColor = '#e53935';
                clearChatBtn.innerText = '🗑️ נקה היסטוריית צ\'אט נוכחי';
                clearChatBtn.onclick = () => {
                    if (confirm('האם לנקות את ההודעות בצ\'אט הנוכחי?')) {
                        socket.emit('clear-current-chat', currentRoomId);
                    }
                };
                sidebarContent.appendChild(clearChatBtn);

                // 2. למעלה: רשימת משתמשים
                let adminHeaderTitle = document.createElement('div');
                adminHeaderTitle.innerHTML = '<br><strong style="color:#d32f2f; font-size:13px;">👥 רשימת משתמשים:</strong>';
                sidebarContent.appendChild(adminHeaderTitle);

                globalUsers.forEach(user => {
                    if (user.nickname !== currentNickname) {
                        const item = document.createElement('div');
                        item.className = 'user-mgmt-item';
                        let statusHtml = user.online ? `<span class="online-status">מחובר</span>` : `<span class="offline-status">נראה: ${user.lastSeen}</span>`;
                        item.innerHTML = `
                            <span style="flex:1;"><strong>${user.nickname}</strong><br>${statusHtml}</span>
                            <div style="display:flex; gap:2px;">
                                <button style="background:#0084ff;color:white;border:none;padding:3px 5px;border-radius:3px;cursor:pointer;" onclick="createPrivateChatWithUser('${user.nickname}')">צ'אט</button>
                                <button style="background:#e53935;color:white;border:none;padding:3px 5px;border-radius:3px;cursor:pointer;" onclick="openBanModal('${user.id}')">חסום</button>
                            </div>
                        `;
                        sidebarContent.appendChild(item);
                    }
                });

                // 3. למטה: חדרים וצ'אטים פרטיים - עם חיבור אירוע ישיר שמבטיח כניסה לחדר
                let roomsHeader = document.createElement('div');
                roomsHeader.innerHTML = '<br><strong style="color:#0084ff; font-size:13px;">💬 חדרים וצ\'אטים פרטיים:</strong>';
                sidebarContent.appendChild(roomsHeader);

                for (let rId in globalRooms) {
                    let r = globalRooms[rId];
                    const roomItem = document.createElement('div');
                    roomItem.className = 'room-item';
                    roomItem.innerHTML = `
                        <div style="flex:1;">
                            <strong>${r.name}</strong><br>
                            <small style="color:#666;">משתתפים: ${(r.members || []).join(', ')}</small>
                        </div>
                        <div style="display:flex; gap:3px;">
                            <button class="enter-room-btn" data-roomid="${rId}" data-roomname="${r.name}" style="background:#0084ff;color:white;border:none;padding:3px 6px;border-radius:3px;cursor:pointer;">הכנס</button>
                            <button style="background:#e53935;color:white;border:none;padding:3px 6px;border-radius:3px;cursor:pointer;" onclick="deletePrivateRoom('${rId}')">מחק</button>
                        </div>
                    `;
                    sidebarContent.appendChild(roomItem);
                }

                // הוספת מאזין לחיצה אמין לכפתורי הכניסה לחדרים
                setTimeout(() => {
                    document.querySelectorAll('.enter-room-btn').forEach(btn => {
                        btn.onclick = function() {
                            switchToRoom(this.dataset.roomid, this.dataset.roomname);
                        };
                    });
                }, 50);

            } else {
                sidebarTitle.innerText = "משתמשים מחוברים";
                globalUsers.forEach(user => {
                    if (user.nickname !== currentNickname) {
                        const item = document.createElement('div');
                        item.className = 'user-mgmt-item';
                        let statusHtml = user.online ? `<span class="online-status">מחובר כעת</span>` : `<span class="offline-status">התחבר ב-${user.lastSeen}</span>`;
                        item.innerHTML = `
                            <span style="flex:1;"><strong>${user.nickname}</strong><br>${statusHtml}</span>
                            <button style="background:#0084ff;color:white;border:none;padding:4px 8px;border-radius:3px;cursor:pointer;font-weight:bold;" onclick="createPrivateChatWithUser('${user.nickname}')">💬 צ'אט</button>
                        `;
                        sidebarContent.appendChild(item);
                    }
                });
            }
        });

        function deletePrivateRoom(roomId) {
            if (confirm('האם אתה בטוח שברצונך למחוק את החדר הזה לצמיתות?')) {
                socket.emit('delete-private-room', roomId);
            }
        }

        let selectedTargetIdForBan = null;
        function openBanModal(targetId) {
            selectedTargetIdForBan = targetId;
            document.getElementById('ban-modal').style.display = 'flex';
        }
        function closeBanModal() {
            document.getElementById('ban-modal').style.display = 'none';
            selectedTargetIdForBan = null;
        }
        function confirmBanUser() {
            if (!selectedTargetIdForBan) return;
            socket.emit('ban-user', { targetId: selectedTargetIdForBan, durationMs: 3600*1000 });
            closeBanModal();
        }

        function leaveChat() {
            if (confirm('לעזוב את הקבוצה?')) {
                localStorage.clear();
                window.location.reload();
            }
        }
    </script>
</body>
</html>

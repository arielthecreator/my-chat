<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צ'אט קבוצתי מתקדם</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        @media (min-width: 601px) {
            .container {
                height: 90vh;
                border-radius: 10px;
            }
        }
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 20px;
            text-align: center;
        }
        #login-screen input {
            padding: 12px;
            font-size: 16px;
            width: 80%;
            max-width: 300px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #login-screen button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #chat-screen {
            display: none;
            flex-direction: column;
            flex: 1;
            height: 100%;
        }
        header {
            background-color: #0084ff;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        #chat-title {
            margin: 0;
            cursor: pointer;
            user-select: none;
        }
        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #f7f9fa;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 75%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            word-break: break-word;
            position: relative;
        }
        .message.system {
            background: #e4e6eb;
            color: #65676b;
            align-self: center;
            font-size: 13px;
            text-align: center;
            max-width: 100%;
        }
        .badge {
            background: #ff9800;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
            font-weight: bold;
        }
        .msg-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }
        .ticks {
            font-weight: bold;
            color: #999;
            font-size: 13px;
        }
        .ticks.read {
            color: #34b7f1;
        }
        .msg-options {
            position: absolute;
            top: 5px;
            left: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #888;
        }
        .msg-menu {
            display: none;
            position: absolute;
            left: 10px;
            top: 25px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .msg-menu button {
            display: block;
            background: none;
            border: none;
            padding: 5px 12px;
            text-align: right;
            width: 100%;
            cursor: pointer;
            font-size: 13px;
        }
        .msg-menu button:hover { background: #f0f2f5; }

        /* סגנון הקלדה בועה בסגנון וואטסאפ */
        #typing-indicator {
            padding: 8px 12px;
            background: white;
            border-radius: 15px;
            align-self: flex-start;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            display: none;
            align-items: center;
            gap: 4px;
            margin-bottom: 5px;
        }
        .typing-dot {
            width: 7px;
            height: 7px;
            background-color: #90949c;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        #chat-form {
            display: flex;
            align-items: center;
            padding: 10px;
            background: white;
            border-top: 1px solid #ddd;
            gap: 5px;
        }
        #chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
        }
        #chat-form button {
            padding: 10px 15px;
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #mic-btn {
            background-color: #e4e6eb;
            color: #333;
            font-size: 18px;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        #mic-btn.recording {
            background-color: #e53935;
            color: white;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        audio {
            max-width: 100%;
            height: 35px;
            margin-top: 5px;
        }
        #sidebar {
            position: absolute;
            top: 0;
            right: -250px;
            width: 250px;
            height: 100%;
            background: white;
            box-shadow: -2px 0 5px rgba(0,0,0,0.2);
            transition: right 0.3s ease;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }
        #sidebar.open { right: 0; }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .user-mgmt-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 8px;
            background: #f9f9f9;
            padding: 6px;
            border-radius: 4px;
        }
        .user-info-area {
            display: flex;
            flex-direction: column;
        }
        .online-status { font-size: 11px; color: #4caf50; font-weight: bold; }
        .offline-status { font-size: 11px; color: #888; }
        .user-mgmt-btns button {
            font-size: 11px;
            padding: 3px 6px;
            margin-right: 2px;
            cursor: pointer;
            border: none;
            border-radius: 3px;
        }
        .btn-admin { background: #4caf50; color: white; }
        .btn-kick { background: #e53935; color: white; }
        .clear-chat-btn {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 13px;
            width: 100%;
        }
        .edit-nick-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            margin-right: 5px;
        }
        .leave-btn {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: auto;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- מסך כניסה -->
        <div id="login-screen">
            <h2>ברוכים הבאים לצ'אט</h2>
            <p>בחר כינוי כדי להיכנס לשיחה:</p>
            <input type="text" id="nickname-input" placeholder="הכנס כינוי...">
            <br>
            <button id="login-btn">הכנס לצ'אט</button>
        </div>

        <!-- מסך צ'אט -->
        <div id="chat-screen">
            <header>
                <button class="menu-btn" id="menu-toggle">☰</button>
                <h3 id="chat-title">צ'אט קבוצתי</h3>
                <div>
                    <span id="user-display" style="font-size: 13px;"></span>
                    <button class="edit-nick-btn" onclick="changeNickname()" title="שנה כינוי">✏️</button>
                </div>
            </header>

            <!-- פאנל צדדי -->
            <div id="sidebar">
                <div class="sidebar-header">
                    <h4 style="margin:0;" id="sidebar-title">תפריט</h4>
                    <button id="close-sidebar" style="background:none;border:none;font-size:18px;cursor:pointer;">✕</button>
                </div>
                <div id="sidebar-content" style="overflow-y:auto; flex:1;"></div>
                <button class="leave-btn" onclick="leaveChat()">עזוב קבוצה</button>
            </div>

            <div id="chat-messages">
                <!-- חיווי הקלדה -->
                <div id="typing-indicator">
                    <span id="typing-text" style="font-size: 12px; color: #65676b;">מישהו מקליד</span>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>

            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="כתוב הודעה..." autocomplete="off">
                <button type="button" id="mic-btn" title="הקלט הודעה קולית">🎤</button>
                <button type="submit">שלח</button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const nicknameInput = document.getElementById('nickname-input');
        const loginBtn = document.getElementById('login-btn');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');
        const userDisplay = document.getElementById('user-display');
        const micBtn = document.getElementById('mic-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const typingText = document.getElementById('typing-text');
        
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const closeSidebar = document.getElementById('close-sidebar');
        const sidebarContent = document.getElementById('sidebar-content');
        const sidebarTitle = document.getElementById('sidebar-title');
        const chatTitle = document.getElementById('chat-title');

        let currentNickname = localStorage.getItem('chat_nickname') || '';
        let isUserAdmin = localStorage.getItem('chat_is_admin') === 'true';
        let originalTitle = document.title;
        let typingTimeout;
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        // בקשת הרשאת התראות בדפדפן
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        window.addEventListener('focus', () => {
            document.title = originalTitle;
            if (currentNickname) {
                socket.emit('mark-as-read');
            }
        });

        if (currentNickname) {
            nicknameInput.value = currentNickname;
            startChatSession();
            socket.emit('join', { nickname: currentNickname, isAdmin: isUserAdmin });
        }

        loginBtn.addEventListener('click', () => {
            const nick = nicknameInput.value.trim();
            if (!nick) {
                alert('אנא הכנס כינוי תקין');
                return;
            }
            currentNickname = nick;
            localStorage.setItem('chat_nickname', currentNickname);
            socket.emit('join', { nickname: currentNickname, isAdmin: isUserAdmin });
            startChatSession();
        });

        nicknameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        function startChatSession() {
            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            userDisplay.innerText = `מחובר כ: ${currentNickname}`;
        }

        // שליחת איתות הקלדה לשרת
        chatInput.addEventListener('input', () => {
            socket.emit('typing', { nickname: currentNickname });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing', { nickname: '' });
            }, 1000);
        });

        socket.on('display-typing', (data) => {
            if (data.nickname && data.nickname !== currentNickname) {
                typingText.innerText = `${data.nickname} מקליד/ה`;
                typingIndicator.style.display = 'flex';
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else {
                typingIndicator.style.display = 'none';
            }
        });

        // שליחת הודעת טקסט
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (text !== '') {
                socket.emit('chat-message', { nickname: currentNickname, text: text, type: 'text' });
                chatInput.value = '';
                socket.emit('typing', { nickname: '' });
            }
        });

        // הקלטה קולית
        micBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result;
                            socket.emit('chat-message', { 
                                nickname: currentNickname, 
                                text: base64Audio, 
                                type: 'audio' 
                            });
                        };
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording');
                    micBtn.innerText = '⏹';
                } catch (err) {
                    alert('לא ניתן לגשת למיקרופון.');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                micBtn.innerText = '🎤';
            }
        });

        menuToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
        closeSidebar.addEventListener('click', () => sidebar.classList.remove('open'));

        let lastClickTime = 0;
        chatTitle.addEventListener('click', () => {
            if (isUserAdmin) return;
            let currentTime = new Date().getTime();
            if (currentTime - lastClickTime < 400) {
                let password = prompt('הכנס סיסמת מנהל:');
                if (password !== null) {
                    socket.emit('verify-admin', password.trim());
                }
            }
            lastClickTime = currentTime;
        });

        socket.on('admin-success', (success) => {
            if (success) {
                isUserAdmin = true;
                localStorage.setItem('chat_is_admin', 'true');
                alert('התחברת בהצלחה כמנהל!');
                socket.emit('join', { nickname: currentNickname, isAdmin: true });
            } else {
                alert('סיסמה שגויה!');
            }
        });

        socket.on('load-messages', (msgs) => {
            chatMessages.querySelectorAll('.message').forEach(m => m.remove());
            msgs.forEach(data => {
                if (data.system) {
                    appendSystemMessage(data.text);
                } else {
                    appendChatMessage(data, false);
                }
            });
            socket.emit('mark-as-read');
        });

        socket.on('new-message', (data) => {
            appendChatMessage(data, true);
            socket.emit('mark-as-read');
        });

        socket.on('update-messages-status', (msgs) => {
            msgs.forEach(data => {
                const div = document.getElementById(data.id);
                if (div) {
                    const ticksEl = div.querySelector('.ticks');
                    if (ticksEl && data.readBy.length > 1) {
                        ticksEl.innerText = '✓✓';
                        ticksEl.classList.add('read');
                    }
                }
            });
        });

        function clearAllMessages() {
            if (confirm('האם אתה בטוח שברצונך לנקות את כל הצ\'אט?')) {
                socket.emit('clear-chat');
            }
        }

        socket.on('chat-cleared', () => {
            chatMessages.querySelectorAll('.message').forEach(m => m.remove());
            alert('הצ\'אט נוקה בהצלחה.');
        });

        function appendChatMessage(data, notify) {
            const div = document.createElement('div');
            div.className = 'message';
            div.id = data.id;

            let badgeHtml = data.role ? `<span class="badge">${data.role}</span>` : '';
            let canEdit = (data.nickname === currentNickname) && (data.type === 'text') || isUserAdmin;

            let isRead = data.readBy && data.readBy.length > 1;
            let ticksClass = isRead ? 'ticks read' : 'ticks';

            let contentHtml = data.type === 'audio' ? `<audio controls src="${data.text}"></audio>` : `<span class="msg-text">${data.text}</span>`;

            div.innerHTML = `
                ${canEdit ? '<span class="msg-options" onclick="toggleMsgMenu(this)">⋮</span>' : ''}
                <div class="msg-menu">
                    <button onclick="editMsg('${data.id}')">ערוך הודעה</button>
                </div>
                <strong>${badgeHtml}${data.nickname}:</strong> ${contentHtml}
                <div class="msg-footer">
                    <span class="msg-time">${data.time || ''}</span>
                    <span class="${ticksClass}">✓✓</span>
                </div>
            `;
            
            // מכניסים לפני אלמנט ההקלדה כדי שההקלדה תמיד תישאר למטה
            chatMessages.insertBefore(div, typingIndicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // הפעלת התראות מערכת ברקע
            if (notify && data.nickname !== currentNickname) {
                document.title = "💬 הודעה חדשה!";
                if ("Notification" in window && Notification.permission === "granted") {
                    try {
                        navigator.serviceWorker.ready.then(registration => {
                            registration.showNotification(data.nickname, {
                                body: data.type === 'audio' ? '🎤 [הודעה קולית]' : data.text,
                                icon: "https://cdn-icons-png.flaticon.com/512/1041/1041916.png"
                            });
                        }).catch(() => {
                            new Notification(data.nickname, {
                                body: data.type === 'audio' ? '🎤 [הודעה קולית]' : data.text,
                                icon: "https://cdn-icons-png.flaticon.com/512/1041/1041916.png"
                            });
                        });
                    } catch (e) {
                        new Notification(data.nickname, {
                            body: data.type === 'audio' ? '🎤 [הודעה קולית]' : data.text
                        });
                    }
                }
            }
        }

        function appendSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message system';
            div.innerText = text;
            chatMessages.insertBefore(div, typingIndicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function toggleMsgMenu(el) {
            const menu = el.nextElementSibling;
            document.querySelectorAll('.msg-menu').forEach(m => { if(m !== menu) m.style.display = 'none'; });
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function editMsg(id) {
            const msgDiv = document.getElementById(id);
            const textSpan = msgDiv.querySelector('.msg-text');
            if (!textSpan) return;
            const newText = prompt('ערוך הודעה:', textSpan.innerText);
            if (newText !== null && newText.trim() !== '') {
                socket.emit('edit-message', { id: id, newText: newText.trim() });
            }
            msgDiv.querySelector('.msg-menu').style.display = 'none';
        }

        socket.on('message-edited', (data) => {
            const msgDiv = document.getElementById(data.id);
            if (msgDiv) {
                const textSpan = msgDiv.querySelector('.msg-text');
                if (textSpan) textSpan.innerText = data.newText;
            }
        });

        // עדכון תפריט צד (כולל "נראה לאחרונה" סודי למנהלים)
        socket.on('update-users', (data) => {
            const activeUsers = data.activeUsers;
            const me = activeUsers.find(u => u.id === socket.id);
            if (me && me.isAdmin) {
                isUserAdmin = true;
                localStorage.setItem('chat_is_admin', 'true');
            }

            if (isUserAdmin) {
                sidebarTitle.innerText = "ניהול משתמשים (סודי)";
                sidebarContent.innerHTML = '<button class="clear-chat-btn" onclick="clearAllMessages()">🧹 נקה את כל הצ\'אט</button>';
                data.allUsers.forEach(user => {
                    if (user.nickname !== currentNickname) {
                        const item = document.createElement('div');
                        item.className = 'user-mgmt-item';
                        let roleLabel = user.role ? `(${user.role})` : '';
                        let statusHtml = user.online 
                            ? `<span class="online-status">מחובר כעת</span>` 
                            : `<span class="offline-status">נראה לאחרונה: ${user.lastSeen || 'לא ידוע'}</span>`;
                        
                        item.innerHTML = `
                            <div class="user-info-area">
                                <strong style="font-size:14px;">${user.nickname} ${roleLabel}</strong>
                                ${statusHtml}
                            </div>
                            <div class="user-mgmt-btns">
                                <button class="btn-admin" onclick="promptRole('${user.id}')">הגדר מנהל</button>
                                ${user.online ? `<button class="btn-kick" onclick="kickUser('${user.id}')">הסר</button>` : ''}
                            </div>
                        `;
                        sidebarContent.appendChild(item);
                    }
                });
            } else {
                sidebarTitle.innerText = "תפריט קבוצה";
                sidebarContent.innerHTML = '<p style="font-size: 14px; color: #666; text-align: center; margin-top: 20px;">ברוך הבא לצ\'אט הקבוצתי!</p>';
            }
        });

        function promptRole(targetId) {
            let choice = prompt('הקלד "מנהל" כדי להוסיף תפקיד, או השאר ריק / כתוב "הסרה" כדי להסיר:');
            if (choice !== null) {
                let role = choice.trim() === 'מנהל' ? 'מנהל' : null;
                socket.emit('set-role', { targetId: targetId, role: role });
            }
        }

        function kickUser(targetId) {
            if (confirm('להסיר את המשתמש מהצ\'אט?')) {
                socket.emit('kick-user', targetId);
            }
        }

        function changeNickname() {
            const newNick = prompt('הכנס כינוי חדש:', currentNickname);
            if (newNick && newNick.trim() !== '' && newNick.trim() !== currentNickname) {
                currentNickname = newNick.trim();
                localStorage.setItem('chat_nickname', currentNickname);
                userDisplay.innerText = `מחובר כ: ${currentNickname}`;
                socket.emit('change-nickname', { newNickname: currentNickname });
            }
        }

        function leaveChat() {
            if (confirm('האם אתה בטוח שברצונך לעזוב את הקבוצה?')) {
                localStorage.removeItem('chat_nickname');
                localStorage.removeItem('chat_is_admin');
                window.location.reload();
            }
        }

        socket.on('kicked', () => {
            alert('הוסרת מהקבוצה על ידי המנהל.');
            localStorage.removeItem('chat_nickname');
            localStorage.removeItem('chat_is_admin');
            window.location.reload();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צ'אט קבוצתי מתקדם</title>
    <style>
        body, html {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            margin: 0 auto;
            box-sizing: border-box;
        }
        @media (min-width: 601px) {
            .container {
                height: 90vh;
                margin-top: 5vh;
                border-radius: 10px;
            }
        }
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 20px;
            text-align: center;
        }
        #login-screen input {
            padding: 12px;
            font-size: 16px;
            width: 80%;
            max-width: 300px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #login-screen button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #chat-screen {
            display: none;
            flex-direction: column;
            flex: 1;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        header {
            background-color: #0084ff;
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .menu-btn-wrapper {
            position: relative;
            display: inline-block;
        }
        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }
        #menu-global-badge {
            position: absolute;
            top: -2px;
            right: -5px;
            background: #e53935;
            color: white;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 50%;
            font-weight: bold;
            display: none;
        }
        #chat-title {
            margin: 0;
            cursor: pointer;
            user-select: none;
            font-size: 16px;
            text-decoration: underline;
        }
        .chat-messages-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: #f7f9fa;
        }
        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }
        .message {
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 75%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            word-break: break-word;
            position: relative;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .message.my-message {
            background: #dcf8c6;
            align-self: flex-end;
        }
        .message.system {
            background: #e4e6eb;
            color: #65676b;
            align-self: center;
            font-size: 13px;
            text-align: center;
            max-width: 100%;
            box-shadow: none;
        }
        .badge {
            background: #ff9800;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
            font-weight: bold;
        }
        .quoted-box {
            background: rgba(0, 0, 0, 0.05);
            border-right: 4px solid #0084ff;
            padding: 5px 8px;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 12px;
            color: #444;
        }
        .msg-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #777;
            margin-top: 4px;
        }
        .msg-menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            color: #555;
            position: absolute;
            top: 5px;
            left: 5px;
        }
        .read-receipt { font-size: 12px; font-weight: bold; }
        .read-receipt.blue { color: #0084ff; }
        .read-receipt.gray { color: gray; }

        .reactions-container {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .reaction-badge {
            background: white;
            border: 1px solid #ddd;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            position: relative;
        }
        .reaction-badge:hover { background: #f0f0f0; }
        .reaction-tooltip {
            display: none;
            position: absolute;
            bottom: 25px;
            right: 0;
            background: #333;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 20;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .reaction-badge:hover .reaction-tooltip { display: block; }

        #reply-preview-container {
            display: none;
            background: #f0f2f5;
            padding: 8px 15px;
            border-top: 1px solid #ddd;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            flex-shrink: 0;
        }
        #reply-preview-content {
            border-right: 4px solid #0084ff;
            padding-right: 8px;
            flex: 1;
            color: #333;
        }
        #cancel-reply-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #666;
        }

        #scroll-bottom-btn {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #scroll-bottom-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #e53935;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 50%;
            font-weight: bold;
            display: none;
        }

        #typing-indicator {
            padding: 2px 15px;
            font-size: 12px;
            color: #666;
            background: #f7f9fa;
            height: 18px;
            font-weight: bold;
            flex-shrink: 0;
        }

        #chat-form {
            display: flex;
            align-items: center;
            padding: 8px;
            background: white;
            border-top: 1px solid #ddd;
            gap: 6px;
            flex-shrink: 0;
            box-sizing: border-box;
            width: 100%;
        }
        #chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
            min-width: 0;
        }
        #chat-form button {
            padding: 10px 14px;
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .action-icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            display: none;
            flex-shrink: 0;
        }

        #recording-bar {
            display: none;
            align-items: center;
            padding: 8px 12px;
            background: white;
            border-top: 1px solid #ddd;
            gap: 8px;
            flex-shrink: 0;
            box-sizing: border-box;
            width: 100%;
        }
        .recording-pulse {
            width: 12px;
            height: 12px;
            background: red;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        #sidebar {
            position: absolute;
            top: 0;
            right: -100%;
            width: 85%;
            max-width: 320px;
            height: 100%;
            background: white;
            box-shadow: -2px 0 5px rgba(0,0,0,0.2);
            transition: right 0.3s ease;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }
        #sidebar.open { right: 0; }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 6px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        #sidebar-content {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 10px;
        }
        .menu-action-btn {
            background-color: #0084ff;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            width: 100%;
            flex-shrink: 0;
        }
        .user-mgmt-item, .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 4px;
            gap: 4px;
            border: 1px solid #eee;
            flex-shrink: 0;
        }
        .online-status { color: #4caf50; font-weight: bold; }
        .offline-status { color: #888; }
        .leave-btn {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 6px;
            text-align: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .msg-dropdown {
            display: none;
            position: absolute;
            top: 25px;
            left: 5px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 50;
            min-width: 150px;
        }
        .msg-dropdown button {
            display: block;
            width: 100%;
            padding: 8px;
            background: none;
            border: none;
            text-align: right;
            cursor: pointer;
            font-size: 13px;
        }
        .msg-dropdown button:hover { background: #f0f0f0; }
        .emoji-picker-row {
            display: flex;
            justify-content: space-around;
            padding: 6px;
            border-bottom: 1px solid #eee;
            background: #fafafa;
        }
        .emoji-picker-row span { cursor: pointer; font-size: 16px; }
        
        #ban-modal, #group-modal, #group-info-modal, #add-members-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 80vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .notification-badge {
            background: #e53935;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-right: 5px;
            font-weight: bold;
        }

        #image-viewer-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #image-viewer-content {
            max-width: 90%;
            max-height: 85%;
            border-radius: 6px;
            object-fit: contain;
        }
        #image-viewer-close {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-screen">
            <h2>ברוכים הבאים לצ'אט</h2>
            <p>בחר כינוי כדי להיכנס לשיחה:</p>
            <input type="text" id="nickname-input" placeholder="הכנס כינוי...">
            <br>
            <button id="login-btn">הכנס לצ'אט</button>
        </div>

        <div id="chat-screen">
            <header>
                <div class="menu-btn-wrapper">
                    <button class="menu-btn" id="menu-toggle">☰</button>
                    <span id="menu-global-badge">0</span>
                </div>
                <h3 id="chat-title" onclick="openGroupInfoModal()">צ'אט קבוצתי</h3>
                <div style="display:flex; align-items:center; gap:5px;">
                    <span id="user-display" style="font-size: 13px;"></span>
                    <button onclick="editNickname()" title="שנה כינוי" style="background:none; border:none; color:white; cursor:pointer; font-size:14px;">✏️</button>
                </div>
            </header>

            <div id="sidebar">
                <div class="sidebar-header">
                    <h4 style="margin:0;" id="sidebar-title">תפריט</h4>
                    <button id="close-sidebar" style="background:none;border:none;font-size:18px;cursor:pointer;">✕</button>
                </div>
                <div id="sidebar-content"></div>
                <button class="leave-btn" onclick="leaveChat()">עזוב קבוצה</button>
            </div>

            <div class="chat-messages-wrapper">
                <div id="chat-messages"></div>
                <button id="scroll-bottom-btn">↓<span id="scroll-bottom-badge">0</span></button>
            </div>

            <div id="typing-indicator"></div>

            <div id="reply-preview-container">
                <div id="reply-preview-content"></div>
                <button id="cancel-reply-btn" onclick="cancelReply()">✕</button>
            </div>

            <!-- בר הקלטת אודיו מתקדם -->
            <div id="recording-bar">
                <div id="recording-indicator-wrap" style="display:flex; align-items:center; gap:8px; flex:1; min-width:0;">
                    <div class="recording-pulse"></div>
                    <span id="recording-timer" style="font-size:13px; font-weight:bold; color:#e53935;">00:00</span>
                </div>
                <div id="preview-audio-wrap" style="display:none; flex:1; align-items:center; min-width:0;">
                    <audio id="audio-preview-element" controls style="width:100%; height:32px;"></audio>
                </div>
                <button type="button" id="stop-recording-btn" onclick="stopAudioRecordingToPreview()" style="background:#ff9800; color:white; border:none; border-radius:4px; padding:6px 10px; cursor:pointer; font-size:12px; flex-shrink:0; font-weight:bold;">⏹️ עצור</button>
                <button type="button" onclick="cancelActiveRecording()" style="background:#e53935; color:white; border:none; border-radius:4px; padding:6px 10px; cursor:pointer; font-size:12px; flex-shrink:0;">🗑️ מחק</button>
                <button type="button" id="send-recorded-audio-btn" onclick="sendRecordedAudio()" style="background:#4caf50; color:white; border:none; border-radius:6px; padding:6px 14px; cursor:pointer; font-size:13px; display:none; flex-shrink:0; font-weight:bold;">✔ שלח</button>
            </div>

            <form id="chat-form">
                <input type="file" id="camera-file-input" accept="image/*" capture="environment" style="display:none;" onchange="handleImageSelected(event)">
                <input type="file" id="gallery-file-input" accept="image/*" style="display:none;" onchange="handleImageSelected(event)">
                
                <button type="button" class="action-icon-btn" id="image-upload-btn" onclick="openImageOptions()" title="שלח תמונה">📷</button>
                <button type="button" class="action-icon-btn" id="mic-btn" onclick="startAudioRecording()" title="הקלט הודעה קולית" style="display:inline-block;">🎙️</button>
                
                <input type="text" id="chat-input" placeholder="כתוב הודעה..." autocomplete="off">
                <button type="submit">שלח</button>
            </form>
        </div>
    </div>

    <!-- מודל צפייה בתמונה בגודל מלא -->
    <div id="image-viewer-modal" onclick="closeImageViewer()">
        <button id="image-viewer-close" onclick="closeImageViewer()">✕</button>
        <img id="image-viewer-content" src="" alt="תמונה מוגדלת">
    </div>

    <!-- מודל בחירת מקור תמונה -->
    <div id="image-source-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
        <div class="modal-content" style="text-align:center;">
            <h4 style="margin:0 0 10px 0;">בחר מקור תמונה</h4>
            <button onclick="document.getElementById('camera-file-input').click(); closeImageSourceModal();" style="background:#0084ff; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; font-size:14px; margin-bottom:6px; width:100%;">📸 צלם תמונה חיה</button>
            <button onclick="document.getElementById('gallery-file-input').click(); closeImageSourceModal();" style="background:#607d8b; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; font-size:14px; width:100%;">🖼️ בחר מהגלריה</button>
            <button onclick="closeImageSourceModal()" style="background:#ccc; border:none; padding:6px; border-radius:4px; cursor:pointer; margin-top:10px; width:100%;">ביטול</button>
        </div>
    </div>

    <!-- מודל חסימה -->
    <div id="ban-modal">
        <div class="modal-content">
            <h4 style="margin:0 0 10px 0;">בחר משך חסימה</h4>
            <select id="ban-duration-select">
                <option value="1h">שעה אחת</option>
                <option value="24h">יום אחד</option>
            </select>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
                <button onclick="closeBanModal()" style="background:#ccc; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">ביטול</button>
                <button onclick="confirmBanUser()" style="background:#e53935; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">חסום</button>
            </div>
        </div>
    </div>

    <!-- מודל פתיחת קבוצה עם כמה אנשים -->
    <div id="group-modal">
        <div class="modal-content">
            <h4 style="margin:0 0 5px 0;">פתיחת קבוצה עם כמה אנשים</h4>
            <input type="text" id="group-name-input" placeholder="הכנס שם קבוצה..." style="padding:8px; border:1px solid #ddd; border-radius:4px; width:100%; box-sizing:border-box;">
            <p style="margin:5px 0; font-size:12px; color:#666;">בחר משתתפים:</p>
            <div id="group-users-checkboxes" style="max-height:140px; overflow-y:auto; border:1px solid #eee; padding:5px; border-radius:4px; display:flex; flex-direction:column; gap:4px;"></div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
                <button onclick="closeGroupModal()" style="background:#ccc; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">ביטול</button>
                <button onclick="confirmCreateGroup()" style="background:#0084ff; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">אישור</button>
            </div>
        </div>
    </div>

    <!-- מודל פרטי וניהול קבוצה -->
    <div id="group-info-modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 id="info-group-title" style="margin:0;">פרטי קבוצה</h3>
                <button onclick="closeGroupInfoModal()" style="background:none;border:none;font-size:16px;cursor:pointer;">✕</button>
            </div>
            <div id="group-settings-area" style="margin-top:5px; display:flex; flex-direction:column; gap:8px;"></div>
            <hr style="border:0; border-top:1px solid #eee; margin:5px 0;">
            <h4 style="margin:0; font-size:13px; color:#555;">משתתפים בקבוצה:</h4>
            <div id="group-members-list" style="max-height:160px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;"></div>
            <div style="display:flex; gap:6px; margin-top:5px;">
                <button id="add-member-btn" onclick="openAddMembersModal()" style="flex:1; background:#4caf50; color:white; border:none; padding:8px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:12px; display:none;">➕ הוסף אנשים</button>
                <button onclick="leaveCurrentGroup()" style="background:#e53935; color:white; border:none; padding:8px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:12px;">🚪 עזוב קבוצה</button>
            </div>
        </div>
    </div>

    <!-- מודל הוספת משתמשים לקבוצה קיימת -->
    <div id="add-members-modal">
        <div class="modal-content">
            <h4 style="margin:0 0 5px 0;">הוסף משתתפים לקבוצה</h4>
            <div id="add-members-checkboxes" style="max-height:150px; overflow-y:auto; border:1px solid #eee; padding:5px; border-radius:4px; display:flex; flex-direction:column; gap:4px;"></div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
                <button onclick="closeAddMembersModal()" style="background:#ccc; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">ביטול</button>
                <button onclick="confirmAddMembers()" style="background:#0084ff; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">הוסף</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // --- רישום Service Worker להתראות דחיפה אמיתיות ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => {
                        console.log('Service Worker registered!', reg);

        async function startAudioRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(recordedAudioBlob);
                    
                    document.getElementById('recording-indicator-wrap').style.display = 'none';
                    document.getElementById('stop-recording-btn').style.display = 'none';
                    document.getElementById('preview-audio-wrap').style.display = 'flex';
                    document.getElementById('audio-preview-element').src = audioUrl;
                    document.getElementById('send-recorded-audio-btn').style.display = 'inline-block';
                    
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                recordingSeconds = 0;
                document.getElementById('recording-timer').innerText = "00:00";
                
                recordingBar.style.display = 'flex';
                document.getElementById('recording-indicator-wrap').style.display = 'flex';
                document.getElementById('stop-recording-btn').style.display = 'inline-block';
                document.getElementById('preview-audio-wrap').style.display = 'none';
                document.getElementById('send-recorded-audio-btn').style.display = 'none';
                chatForm.style.display = 'none';

                recordingTimerInterval = setInterval(() => {
                    recordingSeconds++;
                    let mins = Math.floor(recordingSeconds / 60).toString().padStart(2, '0');
                    let secs = (recordingSeconds % 60).toString().padStart(2, '0');
                    document.getElementById('recording-timer').innerText = `${mins}:${secs}`;
                }, 1000);

            } catch (err) {
                alert('אין גישה למיקרופון או שהמכשיר אינו תומך בהקלטה.');
            }
        }

        function stopAudioRecordingToPreview() {
            clearInterval(recordingTimerInterval);
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        function cancelActiveRecording() {
            clearInterval(recordingTimerInterval);
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            recordedAudioBlob = null;
            recordingBar.style.display = 'none';
            chatForm.style.display = 'flex';
        }

        }

                    </div>
                    <button onclick="startReply('${data.id}')">השב (ציטוט)</button>
                    ${canDelete ? `<button onclick="deleteMessage('${data.id}')" style="color:red;">מחק</button>` : ''}
                </div>
                ${quotedHtml}
                <strong>${badgeHtml}${data.nickname}:</strong>
                ${contentHtml}
                <div class="reactions-container" id="reactions-${data.id}"></div>
                <div class="msg-footer">
                    <span>${timeString}</span>
                    <span class="read-receipt ${data.isAllRead ? 'blue' : 'gray'}">${data.isAllRead ? '✓✓' : '✓'}</span>
                </div>
            `;

            let touchStartX = 0;
            div.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
            div.addEventListener('touchend', (e) => {
                let touchEndX = e.changedTouches[0].clientX;
                if (touchEndX - touchStartX > 50) {
                    startReply(data.id);
                }
            });

            chatMessages.appendChild(div);
            updateMessageReactionsDOM(data.id, data.reactions || {});
            handleScrollAfterAppend(shouldScrollCheck);
            socket.emit('mark-as-read');
        }

        function updateMessageReactionsDOM(msgId, reactionsObj) {
            const container = document.getElementById(`reactions-${msgId}`);
            if (!container) return;
            container.innerHTML = '';
            
            let emojiToNames = {};
            for (let nick in reactionsObj) {
                let emoji = reactionsObj[nick];
                if (!emojiToNames[emoji]) emojiToNames[emoji] = [];
                emojiToNames[emoji].push(nick);
            }

            for (let emoji in emojiToNames) {
                let namesList = emojiToNames[emoji].join(', ');
                const badge = document.createElement('div');
                badge.className = 'reaction-badge';
                badge.innerHTML = `${emoji} <span>${emojiToNames[emoji].length}</span><div class="reaction-tooltip">${namesList}</div>`;
                container.appendChild(badge);
            }
        }

        function addReaction(msgId, emoji) {
            socket.emit('reaction-message', { messageId: msgId, emoji: emoji });
            toggleMsgMenu(msgId);
        }

        function startReply(msgId) {
            const msg = activeMessagesData.find(m => m.id === msgId);
            if (!msg) return;
            currentReplyingTo = msg;
            replyPreviewContent.innerHTML = `<strong>משיב ל-${msg.nickname}:</strong> ${msg.text || 'מדיה'}`;
            replyPreviewContainer.style.display = 'flex';
            chatInput.focus();
            toggleMsgMenu(msgId);
        }

        function cancelReply() {
            currentReplyingTo = null;
            replyPreviewContainer.style.display = 'none';
            replyPreviewContent.innerHTML = '';
        }

        function handleScrollAfterAppend(shouldScrollCheck) {
            if (!shouldScrollCheck) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return;
            }
            if (isUserScrolledUp) {
                unreadScrolledCount++;
                scrollBottomBtn.style.display = 'flex';
                scrollBottomBadge.style.display = 'inline-block';
                scrollBottomBadge.innerText = unreadScrolledCount;
            } else {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function toggleMsgMenu(msgId) {
            document.querySelectorAll('.msg-dropdown').forEach(d => {
                if (d.id !== `dropdown-${msgId}`) d.style.display = 'none';
            });
            const menu = document.getElementById(`dropdown-${msgId}`);
            if (menu) menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function deleteMessage(msgId) {
            if (confirm('האם למחוק הודעה זו?')) {
                socket.emit('delete-message', msgId);
            }
            toggleMsgMenu(msgId);
        }

        socket.on('update-data', (data) => {
            let uniqueUsersMap = {};
            (data.allUsers || []).forEach(u => {
                uniqueUsersMap[u.nickname] = u;
                if (u.nickname === currentNickname) {
                    canSendImages = u.canSendImages;
                    if (canSendImages) {
                        imageUploadBtn.style.display = 'inline-block';
                    } else {
                        imageUploadBtn.style.display = 'none';
                    }
                }
            });
            globalUsers = Object.values(uniqueUsersMap);
            globalRooms = data.privateRooms || {};
            updateSidebarUI();
        });

        function updateSidebarUI() {
            sidebarContent.innerHTML = '';

            if (currentRoomId !== 'public') {
                const backBtn = document.createElement('button');
                backBtn.className = 'menu-action-btn';
                backBtn.style.backgroundColor = '#607d8b';
                backBtn.innerText = '⬅️ חזרה לצ\'אט הראשי';
                backBtn.onclick = () => switchToRoom('public', 'צ\'אט קבוצתי');
                sidebarContent.appendChild(backBtn);
            }

            const groupBtn = document.createElement('button');
            groupBtn.className = 'menu-action-btn';
            groupBtn.style.backgroundColor = '#4caf50';
            groupBtn.style.marginTop = '4px';
            groupBtn.innerText = '👥 פתיחת קבוצה עם כמה אנשים';
            groupBtn.onclick = openGroupModal;
            sidebarContent.appendChild(groupBtn);

            if (isUserAdmin) {
                sidebarTitle.innerText = "פאנל ניהול סודי 🛡️";

                const clearChatBtn = document.createElement('button');
                clearChatBtn.className = 'menu-action-btn';
                clearChatBtn.style.backgroundColor = '#e53935';
                clearChatBtn.style.marginTop = '4px';
                clearChatBtn.innerText = '🗑️ נקה היסטוריית צ\'אט נוכחי';
                clearChatBtn.onclick = () => {
                    if (confirm('האם לנקות את ההודעות בצ\'אט הנוכחי?')) {
                        socket.emit('clear-current-chat', currentRoomId);
                    }
                };
                sidebarContent.appendChild(clearChatBtn);

                let adminHeaderTitle = document.createElement('div');
                adminHeaderTitle.innerHTML = '<br><strong style="color:#d32f2f; font-size:13px;">👥 רשימת משתמשים והרשאות:</strong>';
                sidebarContent.appendChild(adminHeaderTitle);

                globalUsers.forEach(user => {
                    if (user.nickname !== currentNickname) {
                        const item = document.createElement('div');
                        item.className = 'user-mgmt-item';
                        let statusHtml = user.online ? `<span class="online-status">מחובר</span>` : `<span class="offline-status">נראה: ${user.lastSeen}</span>`;
                        let imgPermText = user.canSendImages ? '🖼️ תמונות: מותר' : '🖼️ תמונות: חסום';
                        let imgBtnColor = user.canSendImages ? '#4caf50' : '#777';

                        item.innerHTML = `
                            <span style="flex:1;"><strong>${user.nickname}</strong><br>${statusHtml}</span>
                            <div style="display:flex; gap:2px; flex-wrap:wrap; justify-content:flex-end;">
                                <button style="background:${imgBtnColor};color:white;border:none;padding:3px 5px;border-radius:3px;cursor:pointer;font-size:10px;" onclick="toggleImagePermissionConfirm('${user.id}', '${user.nickname}', ${user.canSendImages})">${imgPermText}</button>
                                <button style="background:#0084ff;color:white;border:none;padding:3px 5px;border-radius:3px;cursor:pointer;" onclick="createPrivateChatWithUser('${user.nickname}')">צ'אט</button>
                                <button style="background:#e53935;color:white;border:none;padding:3px 5px;border-radius:3px;cursor:pointer;" onclick="openBanModal('${user.id}')">חסום</button>
                            </div>
                        `;
                        sidebarContent.appendChild(item);
                    }
                });

                let roomsHeader = document.createElement('div');
                roomsHeader.innerHTML = '<br><strong style="color:#0084ff; font-size:13px;">💬 חדרים וצ\'אטים פרטיים:</strong>';
                sidebarContent.appendChild(roomsHeader);

                for (let rId in globalRooms) {
                    let r = globalRooms[rId];
                    let notifyBadge = unreadRoomsMap[rId] ? `<span class="notification-badge">חדש!</span>` : '';
                    const roomItem = document.createElement('div');
                    roomItem.className = 'room-item';
                    roomItem.innerHTML = `
                        <div style="flex:1;">
                            <strong>${r.name}</strong> ${notifyBadge}<br>
                            <small style="color:#666;">משתתפים: ${(r.members || []).join(', ')}</small>
                        </div>
                        <div style="display:flex; gap:3px;">
                            <button class="enter-room-btn" data-roomid="${rId}" data-roomname="${r.name}" style="background:#0084ff;color:white;border:none;padding:3px 6px;border-radius:3px;cursor:pointer;">הכנס</button>
                            <button style="background:#e53935;color:white;border:none;padding:3px 6px;border-radius:3px;cursor:pointer;" onclick="deletePrivateRoom('${rId}')">מחק</button>
                        </div>
                    `;
                    sidebarContent.appendChild(roomItem);
                }

            } else {
                sidebarTitle.innerText = "משתמשים מחוברים";
                
                let usersHeaderTitle = document.createElement('div');
                usersHeaderTitle.innerHTML = '<br><strong style="color:#2e7d32; font-size:13px;">👥 רשימת משתמשים:</strong>';
                sidebarContent.appendChild(usersHeaderTitle);

                globalUsers.forEach(user => {
                    if (user.nickname !== currentNickname) {
                        const item = document.createElement('div');
                        item.className = 'user-mgmt-item';
                        let statusHtml = user.online ? `<span class="online-status">מחובר כעת</span>` : `<span class="offline-status">התחבר ב-${user.lastSeen}</span>`;
                        item.innerHTML = `
                            <span style="flex:1;"><strong>${user.nickname}</strong><br>${statusHtml}</span>
                            <button style="background:#0084ff;color:white;border:none;padding:4px 8px;border-radius:3px;cursor:pointer;font-weight:bold;" onclick="createPrivateChatWithUser('${user.nickname}')">💬 צ'אט</button>
                        `;
                        sidebarContent.appendChild(item);
                    }
                });

                let roomsHeader = document.createElement('div');
                roomsHeader.innerHTML = '<br><strong style="color:#0084ff; font-size:13px;">💬 חדרים וצ\'אטים פרטיים:</strong>';
                sidebarContent.appendChild(roomsHeader);

                let hasMyRooms = false;
                for (let rId in globalRooms) {
                    let r = globalRooms[rId];
                    if (r.members && r.members.includes(currentNickname)) {
                        hasMyRooms = true;
                        let notifyBadge = unreadRoomsMap[rId] ? `<span class="notification-badge">חדש!</span>` : '';
                        const roomItem = document.createElement('div');
                        roomItem.className = 'room-item';
                        roomItem.innerHTML = `
                            <div style="flex:1;">
                                <strong>${r.name}</strong> ${notifyBadge}<br>
                                <small style="color:#666;">משתתפים: ${(r.members || []).join(', ')}</small>
                            </div>
                            <div>
                                <button class="enter-room-btn" data-roomid="${rId}" data-roomname="${r.name}" style="background:#0084ff;color:white;border:none;padding:3px 6px;border-radius:3px;cursor:pointer;">הכנס</button>
                            </div>
                        `;
                        sidebarContent.appendChild(roomItem);
                    }
                }

                if (!hasMyRooms) {
                    const noRoomsMsg = document.createElement('div');
                    noRoomsMsg.style.fontSize = '12px';
                    noRoomsMsg.style.color = '#888';
                    noRoomsMsg.style.padding = '4px';
                    noRoomsMsg.innerText = 'אין צ\'אטים פרטיים פעילים';
                    sidebarContent.appendChild(noRoomsMsg);
                }
            }

            setTimeout(() => {
                document.querySelectorAll('.enter-room-btn').forEach(btn => {
                    btn.onclick = function() {
                        switchToRoom(this.dataset.roomid, this.dataset.roomname);
                    };
                });
            }, 50);
        }

        function deletePrivateRoom(roomId) {
            if (confirm('האם אתה בטוח שברצונך למחק את החדר הזה לצמיתות?')) {
                socket.emit('delete-private-room', roomId);
            }
        }

        let selectedTargetIdForBan = null;
        function openBanModal(targetId) {
            selectedTargetIdForBan = targetId;
            document.getElementById('ban-modal').style.display = 'flex';
        }
        function closeBanModal() {
            document.getElementById('ban-modal').style.display = 'none';
            selectedTargetIdForBan = null;
        }
        function confirmBanUser() {
            if (!selectedTargetIdForBan) return;
            socket.emit('ban-user', { targetId: selectedTargetIdForBan, durationMs: 3600*1000 });
            closeBanModal();
        }

        function leaveChat() {
            if (confirm('לעזוב את הקבוצה?')) {
                localStorage.clear();
                window.location.reload();
            }
        }
    </script>
</body>
</html>

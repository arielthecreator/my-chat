<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צ'אט קבוצתי מתקדם</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        @media (min-width: 601px) {
            .container {
                height: 90vh;
                border-radius: 10px;
            }
        }
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 20px;
            text-align: center;
        }
        #login-screen input {
            padding: 12px;
            font-size: 16px;
            width: 80%;
            max-width: 300px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #login-screen button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #chat-screen {
            display: none;
            flex-direction: column;
            flex: 1;
            height: 100%;
            position: relative;
        }
        header {
            background-color: #0084ff;
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }
        #chat-title {
            margin: 0;
            cursor: pointer;
            user-select: none;
            font-size: 16px;
        }
        .chat-messages-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: #f7f9fa;
        }
        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 75%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            word-break: break-word;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .message.my-message {
            background: #dcf8c6;
            align-self: flex-end;
        }
        .message.system {
            background: #e4e6eb;
            color: #65676b;
            align-self: center;
            font-size: 13px;
            text-align: center;
            max-width: 100%;
        }
        .badge {
            background: #ff9800;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
            font-weight: bold;
        }
        .quoted-box {
            background: rgba(0, 0, 0, 0.05);
            border-right: 4px solid #0084ff;
            padding: 5px 8px;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 12px;
            color: #444;
        }
        .msg-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #777;
            margin-top: 4px;
        }
        .msg-menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            color: #555;
            position: absolute;
            top: 5px;
            left: 5px;
        }
        .read-receipt { font-size: 12px; font-weight: bold; }
        .read-receipt.blue { color: #0084ff; }
        .read-receipt.gray { color: gray; }

        #reply-preview-container {
            display: none;
            background: #f0f2f5;
            padding: 8px 15px;
            border-top: 1px solid #ddd;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        #reply-preview-content {
            border-right: 4px solid #0084ff;
            padding-right: 8px;
            flex: 1;
            color: #333;
        }
        #cancel-reply-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #666;
        }

        #scroll-bottom-btn {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #scroll-bottom-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #e53935;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 50%;
            font-weight: bold;
            display: none;
        }

        #typing-indicator {
            padding: 2px 15px;
            font-size: 12px;
            color: #666;
            background: #f7f9fa;
            height: 16px;
        }

        #chat-form {
            display: flex;
            align-items: center;
            padding: 8px;
            background: white;
            border-top: 1px solid #ddd;
            gap: 5px;
            flex-shrink: 0;
        }
        #chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
        }
        #chat-form button {
            padding: 10px 15px;
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #sidebar {
            position: absolute;
            top: 0;
            right: -100%;
            width: 85%;
            max-width: 320px;
            height: 100%;
            background: white;
            box-shadow: -2px 0 5px rgba(0,0,0,0.2);
            transition: right 0.3s ease;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }
        #sidebar.open { right: 0; }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 6px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        #sidebar-content {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .menu-action-btn {
            background-color: #0084ff;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            width: 100%;
        }
        .user-mgmt-item, .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 4px;
            gap: 4px;
            border: 1px solid #eee;
        }
        .online-status { color: #4caf50; font-weight: bold; }
        .offline-status { color: #888; }
        .leave-btn {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 6px;
            text-align: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .msg-dropdown {
            display: none;
            position: absolute;
            top: 25px;
            left: 5px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 50;
            min-width: 130px;
        }
        .msg-dropdown button {
            display: block;
            width: 100%;
            padding: 8px;
            background: none;
            border: none;
            text-align: right;
            cursor: pointer;
            font-size: 13px;
        }
        .msg-dropdown button:hover { background: #f0f0f0; }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-screen">
            <h2>ברוכים הבאים לצ'אט</h2>
            <p>בחר כינוי כדי להיכנס לשיחה:</p>
            <input type="text" id="nickname-input" placeholder="הכנס כינוי...">
            <br>
            <button id="login-btn">הכנס לצ'אט</button>
        </div>

        <div id="chat-screen">
            <header>
                <button class="menu-btn" id="menu-toggle">☰</button>
                <h3 id="chat-title">צ'אט קבוצתי</h3>
                <div><span id="user-display" style="font-size: 13px;"></span></div>
            </header>

            <div id="sidebar">
                <div class="sidebar-header">
                    <h4 style="margin:0;" id="sidebar-title">תפריט</h4>
                    <button id="close-sidebar" style="background:none;border:none;font-size:18px;cursor:pointer;">✕</button>
                </div>
                <div id="sidebar-content"></div>
                <button class="leave-btn" onclick="leaveChat()">עזוב קבוצה</button>
            </div>

            <div class="chat-messages-wrapper">
                <div id="chat-messages"></div>
                <button id="scroll-bottom-btn">↓<span id="scroll-bottom-badge">0</span></button>
            </div>

            <div id="typing-indicator"></div>

            <div id="reply-preview-container">
                <div id="reply-preview-content"></div>
                <button id="cancel-reply-btn" onclick="cancelReply()">✕</button>
            </div>

            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="כתוב הודעה..." autocomplete="off">
                <button type="submit">שלח</button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const nicknameInput = document.getElementById('nickname-input');
        const loginBtn = document.getElementById('login-btn');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');
        const userDisplay = document.getElementById('user-display');
        const scrollBottomBtn = document.getElementById('scroll-bottom-btn');
        const scrollBottomBadge = document.getElementById('scroll-bottom-badge');
        const typingIndicator = document.getElementById('typing-indicator');
        
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const closeSidebar = document.getElementById('close-sidebar');
        const sidebarContent = document.getElementById('sidebar-content');
        const sidebarTitle = document.getElementById('sidebar-title');
        const chatTitle = document.getElementById('chat-title');
        
        const replyPreviewContainer = document.getElementById('reply-preview-container');
        const replyPreviewContent = document.getElementById('reply-preview-content');

        let currentNickname = localStorage.getItem('chat_nickname') || '';
        let isUserAdmin = localStorage.getItem('chat_is_admin') === 'true';
        let currentRoomId = 'public';
        let globalUsers = [];
        let globalRooms = {};
        let activeMessagesData = [];
        let unreadScrolledCount = 0;
        let isUserScrolledUp = false;
        let currentReplyingTo = null;

        if (currentNickname) {
            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            userDisplay.innerText = `מחובר כ: ${currentNickname}`;
            socket.emit('join', { nickname: currentNickname, isAdmin: isUserAdmin });
        }

        loginBtn.addEventListener('click', () => {
            const nick = nicknameInput.value.trim();
            if (!nick) { alert('אנא הכנס כינוי תקין'); return; }
            currentNickname = nick;
            localStorage.setItem('chat_nickname', currentNickname);
            socket.emit('join', { nickname: currentNickname, isAdmin: isUserAdmin });
            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            userDisplay.innerText = `מחובר כ: ${currentNickname}`;
        });

        chatMessages.addEventListener('scroll', () => {
            const threshold = 60;
            const position = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
            isUserScrolledUp = position > threshold;

            if (!isUserScrolledUp) {
                unreadScrolledCount = 0;
                scrollBottomBtn.style.display = 'none';
                scrollBottomBadge.style.display = 'none';
                scrollBottomBadge.innerText = '0';
            }
        });

        scrollBottomBtn.addEventListener('click', () => {
            chatMessages.scrollTop = chatMessages.scrollHeight;
            unreadScrolledCount = 0;
            scrollBottomBtn.style.display = 'none';
            scrollBottomBadge.style.display = 'none';
            scrollBottomBadge.innerText = '0';
        });

        let typingTimeout;
        chatInput.addEventListener('input', () => {
            socket.emit('typing', true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { socket.emit('typing', false); }, 1000);
        });

        socket.on('user-typing', (data) => {
            typingIndicator.innerText = data.isTyping ? `${data.nickname} מקליד/ה...` : '';
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (text !== '') {
                socket.emit('chat-message', { 
                    nickname: currentNickname, 
                    text: text, 
                    type: 'text',
                    replyTo: currentReplyingTo ? { id: currentReplyingTo.id, nickname: currentReplyingTo.nickname, text: currentReplyingTo.text } : null
                });
                chatInput.value = '';
                cancelReply();
                socket.emit('typing', false);
            }
        });

        menuToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
        closeSidebar.addEventListener('click', () => sidebar.classList.remove('open'));

        let lastClickTime = 0;
        chatTitle.addEventListener('click', () => {
            if (isUserAdmin) return;
            let currentTime = new Date().getTime();
            if (currentTime - lastClickTime < 400) {
                let password = prompt('הכנס סיסמת מנהל:');
                if (password !== null) socket.emit('verify-admin', password.trim());
            }
            lastClickTime = currentTime;
        });

        socket.on('admin-success', (success) => {
            if (success) {
                isUserAdmin = true;
                localStorage.setItem('chat_is_admin', 'true');
                alert('התחברת בהצלחה כמנהל!');
                socket.emit('join', { nickname: currentNickname, isAdmin: true });
            } else {
                alert('סיסמה שגויה!');
            }
        });

        function createPrivateChatWithUser(targetUser) {
            let roomName = prompt(`איך תרצה לקרוא לצ'אט האישי עם ${targetUser}?`, `צ'אט עם ${targetUser}`);
            if (!roomName || !roomName.trim()) return;
            socket.emit('create-private-room', { roomName: roomName.trim(), targetNickname: targetUser });
        }

        socket.on('room-created', (roomId) => {
            let roomObj = globalRooms[roomId];
            switchToRoom(roomId, roomObj ? roomObj.name : 'צ\'אט אישי');
        });

        // פונקציה מתוקנת לחלוטין לכניסה לחדר בצורה בטוחה
        function switchToRoom(roomId, roomTitle) {
            currentRoomId = roomId;
            // שליפה בטוחה של שם החדר מתוך האובייקט הגלובלי אם הכותרת לא הועברה נכון
            let finalTitle = roomTitle;
            if ((!finalTitle || finalTitle === 'undefined') && globalRooms[roomId]) {
                finalTitle = globalRooms[roomId].name;
            }
            chatTitle.innerText = finalTitle || 'צ\'אט אישי';
            sidebar.classList.remove('open');
            socket.emit('switch-room', roomId);
        }

        socket.on('room-deleted-by-admin', (roomId) => {
            if (currentRoomId === roomId) {
                alert('הצ\'אט האישי הזה נמחק.');
                switchToRoom('public', 'צ\'אט קבוצתי');
            }
        });

        socket.on('load-messages', (msgs) => {
            activeMessagesData = msgs;
            chatMessages.innerHTML = '';
            msgs.forEach(data => appendMessage(data, false));
            chatMessages.scrollTop = chatMessages.scrollHeight;
            socket.emit('mark-as-read');
        });

        socket.on('new-message', (data) => {
            activeMessagesData.push(data);
            appendMessage(data, true);
        });

        socket.on('update-messages-status', (msgs) => {
            activeMessagesData = msgs;
            msgs.forEach(data => {
                const div = document.getElementById(data.id);
                if (div) {
                    const receipt = div.querySelector('.read-receipt');
                    if (receipt) {
                        const readCount = data.readBy ? data.readBy.length : 1;
                        receipt.className = `read-receipt ${readCount > 1 ? 'blue' : 'gray'}`;
                        receipt.innerText = readCount > 1 ? '✓✓' : '✓';
                    }
                }
            });
        });

        socket.on('message-edited', (data) => {
            const msg = activeMessagesData.find(m => m.id === data.messageId);
            if (msg) msg.text = data.newText;
            const div = document.getElementById(data.messageId);
            if (div) {
                const textSpan = div.querySelector('.msg-text');
                if (textSpan) textSpan.innerText = data.newText + ' (נערך)';
            }
        });

        socket.on('message-deleted', (messageId) => {
            activeMessagesData = activeMessagesData.filter(m => m.id !== messageId);
            const div = document.getElementById(messageId);
            if (div) div.remove();
        });

        socket.on('kicked', () => {
            alert('הוסרת מהצ\'אט על ידי מנהל.');
            localStorage.clear();
            window.location.reload();
        });

        function appendMessage(data, shouldScrollCheck) {
            if (data.system) {
                const div = document.createElement('div');
                div.className = 'message system';
                div.innerText = data.text;
                chatMessages.appendChild(div);
                handleScrollAfterAppend(shouldScrollCheck);
                return;
            }

            const div = document.createElement('div');
            div.className = `message ${data.nickname === currentNickname ? 'my-message' : ''}`;
            div.id = data.id;

            let badgeHtml = data.role ? `<span class="badge">${data.role}</span>` : '';
            let isMyMsg = data.nickname === currentNickname;
            let canDelete = isMyMsg || isUserAdmin;

            let quotedHtml = '';
            if (data.replyTo) {
                quotedHtml = `
                    <div class="quoted-box">
                        <strong>${data.replyTo.nickname}:</strong> ${data.replyTo.text}
                    </div>
                `;
            }

            div.innerHTML = `
                <button class="msg-menu-btn" onclick="toggleMsgMenu('${data.id}')">⋮</button>
                <div class="msg-dropdown" id="dropdown-${data.id}">
                    <button onclick="startReply('${data.id}')">השב (ציטוט)</button>
                    ${isMyMsg ? `<button onclick="editMessage('${data.id}')">עריכה</button>` : ''}
                    ${canDelete ? `<button onclick="deleteMessage('${data.id}')" style="color:red;">מחק</button>` : ''}
                    <button onclick="showMsgDetails('${data.id}')">פרטים (מי ראה)</button>
                </div>
                ${quotedHtml}
                <strong>${badgeHtml}${data.nickname}:</strong>
                <span class="msg-text">${data.text}${data.edited ? ' (נערך)' : ''}</span>
                <div class="msg-footer">
                    <span>${data.time || ''}</span>
                    <span class="read-receipt gray">✓</span>
                </div>
            `;

            let touchStartX = 0;
            div.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
            div.addEventListener('touchend', (e) => {
                let touchEndX = e.changedTouches[0].clientX;
                if (touchEndX - touchStartX > 70) {
                    startReply(data.id);
                }
            });

            chatMessages.appendChild(div);
            handleScrollAfterAppend(shouldScrollCheck);
            socket.emit('mark-as-read');
        }

        function startReply(msgId) {
            const msg = activeMessagesData.find(m => m.id === msgId);
            if (!msg) return;
            currentReplyingTo = msg;
            replyPreviewContent.innerHTML = `<strong>משיב ל-${msg.nickname}:</strong> ${msg.text}`;
            replyPreviewContainer.style.display = 'flex';
            chatInput.focus();
            toggleMsgMenu(msgId);
        }

        function cancelReply() {
            currentReplyingTo = null;
            replyPreviewContainer.style.display = 'none';
            replyPreviewContent.innerHTML = '';
        }

        function handleScrollAfterAppend(shouldScrollCheck) {
            if (!shouldScrollCheck) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return;
            }
            if (isUserScrolledUp) {
                unreadScrolledCount++;
                scrollBottomBtn.style.display = 'flex';
                scrollBottomBadge.style.display = 'inline-block';
                scrollBottomBadge.innerText = unreadScrolledCount;
            } else {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function toggleMsgMenu(msgId) {
            document.querySelectorAll('.msg-dropdown').forEach(d => {
                if (d.id !== `dropdown-${msgId}`) d.style.display = 'none';
            });
            const menu = document.getElementById(`dropdown-${msgId}`);
            if (menu) menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function editMessage(msgId) {
            const div = document.getElementById(msgId);
            const textSpan = div.querySelector('.msg-text');
            let currentText = textSpan.innerText.replace(' (נערך)', '');
            let newText = prompt('ערוך הודעה:', currentText);
            if (newText !== null && newText.trim() !== '') {
                socket.emit('edit-message', { messageId: msgId, newText: newText.trim() });
            }
            toggleMsgMenu(msgId);
        }

        function deleteMessage(msgId) {
            if (confirm('האם למחוק הודעה זו?')) { socket.emit('delete-message', msgId); }
            toggleMsgMenu(msgId);
        }

        function showMsgDetails(msgId) {
            const msg = activeMessagesData.find(m => m.id === msgId);
            if (msg && msg.readBy && msg.readBy.length > 0) {
                alert('ההודעה נקראה על ידי:\n• ' + msg.readBy.join('\n• '));
            } else {
                alert('אף אחד עדיין לא קרא את ההודעה.');
            }
            toggleMsgMenu(msgId);
        }

        // עיבוד התפריט בסיידבר עם העברת מזהה החדר והשם בצורה תקינה לחלוטין לכפתורי ה"הכנס"
        socket.on('update-data', (data) => {
            globalUsers = data.allUsers;
            globalRooms = data.privateRooms;
            sidebarContent.innerHTML = '';

            if (currentRoomId !== 'public') {
                const backBtn = document.createElement('button');
                backBtn.className = 'menu-action-btn';
                backBtn.style.backgroundColor = '#607d8b';
                backBtn.innerText = '⬅️ חזרה לצ\'אט הראשי';
                backBtn.onclick = () => switchToRoom('public', 'צ\'אט קבוצתי');
                sidebarContent.appendChild(backBtn);
            }

            if (isUserAdmin) {
                sidebarTitle.innerText = "פאנל מנהל מערכת";

                let adminHeaderTitle = document.createElement('div');
                adminHeaderTitle.innerHTML = '<strong style="color:#d32f2f; font-size:13px;">ניהול משתמשים:</strong>';
                sidebarContent.appendChild(adminHeaderTitle);

                globalUsers.forEach(user => {
                    if (user.nickname !== currentNickname) {
                        const item = document.createElement('div');
                        item.className = 'user-mgmt-item';
                        let statusHtml = user.online ? `<span class="online-status">מחובר</span>` : `<span class="offline-status">נראה: ${user.lastSeen}</span>`;
                        item.innerHTML = `
                            <span style="flex:1;"><strong>${user.nickname}</strong><br>${statusHtml}</span>
                            <div style="display:flex; gap:2px;">
                                <button style="background:#0084ff;color:white;border:none;padding:3px 6px;border-radius:3px;cursor:pointer;" onclick="createPrivateChatWithUser('${user.nickname}')">צ'אט</button>
                                <button style="background:#4caf50;color:white;border:none;padding:3px 6px;border-radius:3px;cursor:pointer;" onclick="promptRole('${user.id}')">מנהל</button>
                                ${user.online ? `<button style="background:#e53935;color:white;border:none;padding:3px 6px;border-radius:3px;cursor:pointer;" onclick="kickUser('${user.id}')">הסר</button>` : ''}
                            </div>
                        `;
                        sidebarContent.appendChild(item);
                    }
                });

                let roomsHeaderTitle = document.createElement('div');
                roomsHeaderTitle.innerHTML = '<br><strong style="color:#d32f2f; font-size:13px;">כל הצ\'אטים האישיים במערכת:</strong>';
                sidebarContent.appendChild(roomsHeaderTitle);

                const roomsKeys = Object.keys(globalRooms);
                if (roomsKeys.length === 0) {
                    let noRooms = document.createElement('div');
                    noRooms.style.fontSize = '12px';
                    noRooms.style.color = '#777';
                    noRooms.innerText = 'אין צ\'אטים אישיים כרגע.';
                    sidebarContent.appendChild(noRooms);
                } else {
                    roomsKeys.forEach(rId => {
                        let room = globalRooms[rId];
                        let item = document.createElement('div');
                        item.className = 'room-item';
                        item.innerHTML = `
                            <span style="flex:1;"><strong>${room.name}</strong><br><small>${room.members.join(', ')}</small></span>
                            <div style="display:flex; gap:2px;">
                                <button style="background:#0084ff;color:white;border:none;padding:3px 6px;border-radius:3px;cursor:pointer;" onclick="switchToRoom('${rId}', '${room.name.replace(/'/g, "\\'")}')">הכנס</button>
                                <button style="background:#e53935;color:white;border:none;padding:3px 6px;border-radius:3px;cursor:pointer;" onclick="deleteRoom('${rId}')">מחק</button>
                            </div>
                        `;
                        sidebarContent.appendChild(item);
                    });
                }
            } else {
                sidebarTitle.innerText = "משתמשים מחוברים";
                globalUsers.forEach(user => {
                    if (user.nickname !== currentNickname) {
                        const item = document.createElement('div');
                        item.className = 'user-mgmt-item';
                        let statusHtml = user.online ? `<span class="online-status">מחובר כעת</span>` : `<span class="offline-status">התחבר ב-${user.lastSeen}</span>`;
                        item.innerHTML = `
                            <span style="flex:1;"><strong>${user.nickname}</strong><br>${statusHtml}</span>
                            <button style="background:#0084ff;color:white;border:none;padding:4px 8px;border-radius:3px;cursor:pointer;font-weight:bold;" onclick="createPrivateChatWithUser('${user.nickname}')">💬 צ'אט</button>
                        `;
                        sidebarContent.appendChild(item);
                    }
                });

                let myRoomsHeader = document.createElement('div');
                myRoomsHeader.innerHTML = '<br><strong style="font-size:13px;">הצ\'אטים הפרטיים שלי:</strong>';
                sidebarContent.appendChild(myRoomsHeader);

                let myRooms = Object.keys(globalRooms).filter(rId => globalRooms[rId].members.includes(currentNickname));
                if (myRooms.length === 0) {
                    let noMyRooms = document.createElement('div');
                    noMyRooms.style.fontSize = '12px';
                    noMyRooms.style.color = '#777';
                    noMyRooms.innerText = 'אין לך צ\'אטים אישיים פעילים.';
                    sidebarContent.appendChild(noMyRooms);
                } else {
                    myRooms.forEach(rId => {
                        let room = globalRooms[rId];
                        let item = document.createElement('div');
                        item.className = 'room-item';
                        item.innerHTML = `
                            <span style="flex:1;"><strong>${room.name}</strong></span>
                            <div style="display:flex; gap:2px;">
                                <button style="background:#0084ff;color:white;border:none;padding:3px 6px;border-radius:3px;cursor:pointer;" onclick="switchToRoom('${rId}', '${room.name.replace(/'/g, "\\'")}')">הכנס</button>
                                <button style="background:#e53935;color:white;border:none;padding:3px 6px;border-radius:3px;cursor:pointer;" onclick="deleteRoom('${rId}')">מחק</button>
                            </div>
                        `;
                        sidebarContent.appendChild(item);
                    });
                }
            }
        });

        function promptRole(targetId) {
            let choice = prompt('הקלד "מנהל" להוספה, או השאר ריק להסרה:');
            if (choice !== null) {
                socket.emit('set-role', { targetId: targetId, role: choice.trim() === 'מנהל' ? 'מנהל' : null });
            }
        }

        function kickUser(targetId) {
            if (confirm('להסיר משתמש זה?')) { socket.emit('kick-user', targetId); }
        }

        function deleteRoom(roomId) {
            if (confirm('למחוק צ\'אט זה לצמיתות?')) {
                socket.emit('delete-private-room', roomId);
                switchToRoom('public', 'צ\'אט קבוצתי');
            }
        }

        function leaveChat() {
            if (confirm('לעזוב את הקבוצה?')) {
                localStorage.clear();
                window.location.reload();
            }
        }
    </script>
</body>
</html>

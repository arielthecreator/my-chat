<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צ'אט קבוצתי מתקדם</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        @media (min-width: 601px) {
            .container {
                height: 90vh;
                border-radius: 10px;
            }
        }
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 20px;
            text-align: center;
        }
        #login-screen input {
            padding: 12px;
            font-size: 16px;
            width: 80%;
            max-width: 300px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #login-screen button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #chat-screen {
            display: none;
            flex-direction: column;
            flex: 1;
            height: 100%;
        }
        header {
            background-color: #0084ff;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        #chat-title {
            margin: 0;
            cursor: pointer;
            user-select: none;
        }
        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #f7f9fa;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 75%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            word-break: break-word;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .message.my-message {
            background: #dcf8c6;
            align-self: flex-end;
        }
        .message.system {
            background: #e4e6eb;
            color: #65676b;
            align-self: center;
            font-size: 13px;
            text-align: center;
            max-width: 100%;
        }
        .badge {
            background: #ff9800;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
            font-weight: bold;
        }
        .msg-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #777;
            margin-top: 4px;
        }
        .msg-menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            color: #555;
            position: absolute;
            top: 5px;
            left: 5px;
        }
        .read-receipt {
            font-size: 12px;
            font-weight: bold;
        }
        .read-receipt.blue { color: #0084ff; }
        .read-receipt.gray { color: gray; }

        #chat-form {
            display: flex;
            align-items: center;
            padding: 10px;
            background: white;
            border-top: 1px solid #ddd;
            gap: 5px;
        }
        #chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
        }
        #chat-form button {
            padding: 10px 15px;
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #sidebar {
            position: absolute;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background: white;
            box-shadow: -2px 0 5px rgba(0,0,0,0.2);
            transition: right 0.3s ease;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }
        #sidebar.open { right: 0; }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .menu-action-btn {
            background-color: #0084ff;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            width: 100%;
            margin-bottom: 8px;
        }
        .user-mgmt-item, .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 6px;
            background: #f9f9f9;
            padding: 6px;
            border-radius: 4px;
            gap: 4px;
        }
        .online-status { color: #4caf50; font-weight: bold; }
        .offline-status { color: #888; }
        .leave-btn {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: auto;
            text-align: center;
            font-weight: bold;
        }
        .msg-dropdown {
            display: none;
            position: absolute;
            top: 25px;
            left: 5px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 50;
            min-width: 120px;
        }
        .msg-dropdown button {
            display: block;
            width: 100%;
            padding: 8px;
            background: none;
            border: none;
            text-align: right;
            cursor: pointer;
            font-size: 13px;
        }
        .msg-dropdown button:hover { background: #f0f0f0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- מסך כניסה -->
        <div id="login-screen">
            <h2>ברוכים הבאים לצ'אט</h2>
            <p>בחר כינוי כדי להיכנס לשיחה:</p>
            <input type="text" id="nickname-input" placeholder="הכנס כינוי...">
            <br>
            <button id="login-btn">הכנס לצ'אט</button>
        </div>

        <!-- מסך צ'אט -->
        <div id="chat-screen">
            <header>
                <button class="menu-btn" id="menu-toggle">☰</button>
                <h3 id="chat-title">צ'אט קבוצתי</h3>
                <div>
                    <span id="user-display" style="font-size: 13px;"></span>
                </div>
            </header>

            <!-- פאנל צדדי -->
            <div id="sidebar">
                <div class="sidebar-header">
                    <h4 style="margin:0;" id="sidebar-title">תפריט</h4>
                    <button id="close-sidebar" style="background:none;border:none;font-size:18px;cursor:pointer;">✕</button>
                </div>
                <div id="sidebar-content" style="overflow-y:auto; flex:1;"></div>
                <button class="leave-btn" onclick="leaveChat()">עזוב קבוצה</button>
            </div>

            <div id="chat-messages"></div>

            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="כתוב הודעה..." autocomplete="off">
                <button type="submit">שלח</button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const nicknameInput = document.getElementById('nickname-input');
        const loginBtn = document.getElementById('login-btn');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');
        const userDisplay = document.getElementById('user-display');
        
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const closeSidebar = document.getElementById('close-sidebar');
        const sidebarContent = document.getElementById('sidebar-content');
        const sidebarTitle = document.getElementById('sidebar-title');
        const chatTitle = document.getElementById('chat-title');

        let currentNickname = localStorage.getItem('chat_nickname') || '';
        let isUserAdmin = localStorage.getItem('chat_is_admin'] === 'true';
        let currentRoomId = 'public';
        let globalUsers = [];
        let globalRooms = {};
        let activeMessagesData = []; // שומר את כל הודעות השרת הנוכחיות כדי להציג מי ראה

        if (currentNickname) {
            nicknameInput.value = currentNickname;
            startChatSession();
            socket.emit('join', { nickname: currentNickname, isAdmin: isUserAdmin });
            requestNotificationPermission();
        }

        loginBtn.addEventListener('click', () => {
            const nick = nicknameInput.value.trim();
            if (!nick) { alert('אנא הכנס כינוי תקין'); return; }
            currentNickname = nick;
            localStorage.setItem('chat_nickname', currentNickname);
            socket.emit('join', { nickname: currentNickname, isAdmin: isUserAdmin });
            startChatSession();
            requestNotificationPermission();
        });

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        function startChatSession() {
            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            userDisplay.innerText = `מחובר כ: ${currentNickname}`;
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (text !== '') {
                socket.emit('chat-message', { nickname: currentNickname, text: text, type: 'text' });
                chatInput.value = '';
            }
        });

        menuToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
        closeSidebar.addEventListener('click', () => sidebar.classList.remove('open'));

        let lastClickTime = 0;
        chatTitle.addEventListener('click', () => {
            if (isUserAdmin) return;
            let currentTime = new Date().getTime();
            if (currentTime - lastClickTime < 400) {
                let password = prompt('הכנס סיסמת מנהל:');
                if (password !== null) socket.emit('verify-admin', password.trim());
            }
            lastClickTime = currentTime;
        });

        socket.on('admin-success', (success) => {
            if (success) {
                isUserAdmin = true;
                localStorage.setItem('chat_is_admin', 'true');
                alert('התחברת בהצלחה כמנהל!');
                socket.emit('join', { nickname: currentNickname, isAdmin: true });
            } else {
                alert('סיסמה שגויה!');
            }
        });

        function openCreatePrivateRoomModal(targetUser = null) {
            let roomName = prompt('איך אתה רוצה לקרוא לצ\'אט האישי?');
            if (!roomName || !roomName.trim()) return;

            let availableUsers = globalUsers.filter(u => u.nickname !== currentNickname).map(u => u.nickname);
            if (availableUsers.length === 0) {
                alert('אין משתמשים אחרים זמינים לצרף כרגע.');
                return;
            }

            let target = targetUser;
            if (!target) {
                target = prompt('בחר את מי לצרף מרשימת המשתמשים הבאה:\n' + availableUsers.join(', '));
            }

            if (!target || !availableUsers.includes(target.trim())) {
                alert('שם משתמש לא תקין.');
                return;
            }

            socket.emit('create-private-room', { roomName: roomName.trim(), targetNickname: target.trim() });
        }

        socket.on('room-created', (roomId) => {
            switchToRoom(roomId, 'צ\'אט אישי');
        });

        function switchToRoom(roomId, roomTitle) {
            currentRoomId = roomId;
            chatTitle.innerText = roomTitle;
            sidebar.classList.remove('open');
            socket.emit('switch-room', roomId);
        }

        socket.on('room-deleted-by-admin', (roomId) => {
            if (currentRoomId === roomId) {
                alert('הצ\'אט האישי הזה נחסם והוסר על ידי המנהל.');
                switchToRoom('public', 'צ\'אט קבוצתי');
            }
        });

        socket.on('load-messages', (msgs) => {
            activeMessagesData = msgs;
            chatMessages.innerHTML = '';
            msgs.forEach(data => appendMessage(data));
            socket.emit('mark-as-read');
        });

        socket.on('new-message', (data) => {
            activeMessagesData.push(data);
            appendMessage(data);
            socket.emit('mark-as-read');

            // התראה קופצת ברקע אם האתר פתוח בטאב אחר או ממוזער
            if (data.nickname !== currentNickname && !data.system) {
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification(`הודעה חדשה מ-${data.nickname}`, {
                        body: data.text,
                        icon: '/favicon.ico'
                    });
                }
            }
        });

        socket.on('update-messages-status', (msgs) => {
            activeMessagesData = msgs;
            msgs.forEach(data => {
                const div = document.getElementById(data.id);
                if (div) {
                    const receipt = div.querySelector('.read-receipt');
                    if (receipt) {
                        const readCount = data.readBy ? data.readBy.length : 1;
                        receipt.className = `read-receipt ${readCount > 1 ? 'blue' : 'gray'}`;
                        receipt.innerText = readCount > 1 ? '✓✓' : '✓';
                    }
                }
            });
        });

        socket.on('message-edited', (data) => {
            const msg = activeMessagesData.find(m => m.id === data.messageId);
            if (msg) msg.text = data.newText;
            const div = document.getElementById(data.messageId);
            if (div) {
                const textSpan = div.querySelector('.msg-text');
                if (textSpan) textSpan.innerText = data.newText + ' (נערך)';
            }
        });

        socket.on('message-deleted', (messageId) => {
            activeMessagesData = activeMessagesData.filter(m => m.id !== messageId);
            const div = document.getElementById(messageId);
            if (div) div.remove();
        });

        socket.on('kicked', () => {
            alert('הוסרת מהצ\'אט על ידי מנהל.');
            localStorage.removeItem('chat_nickname');
            localStorage.removeItem('chat_is_admin');
            window.location.reload();
        });

        function appendMessage(data) {
            if (data.system) {
                const div = document.createElement('div');
                div.className = 'message system';
                div.innerText = data.text;
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return;
            }

            const div = document.createElement('div');
            div.className = `message ${data.nickname === currentNickname ? 'my-message' : ''}`;
            div.id = data.id;

            let badgeHtml = data.role ? `<span class="badge">${data.role}</span>` : '';
            let isMyMsg = data.nickname === currentNickname;
            let canDelete = isMyMsg || isUserAdmin;

            div.innerHTML = `
                <button class="msg-menu-btn" onclick="toggleMsgMenu('${data.id}')">⋮</button>
                <div class="msg-dropdown" id="dropdown-${data.id}">
                    ${isMyMsg ? `<button onclick="editMessage('${data.id}')">עריכה</button>` : ''}
                    ${canDelete ? `<button onclick="deleteMessage('${data.id}')" style="color:red;">מחק</button>` : ''}
                    <button onclick="showMsgDetails('${data.id}')">פרטים (מי ראה)</button>
                </div>
                <strong>${badgeHtml}${data.nickname}:</strong>
                <span class="msg-text">${data.text}${data.edited ? ' (נערך)' : ''}</span>
                <div class="msg-footer">
                    <span>${data.time || ''}</span>
                    <span class="read-receipt gray">✓</span>
                </div>
            `;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function toggleMsgMenu(msgId) {
            document.querySelectorAll('.msg-dropdown').forEach(d => {
                if (d.id !== `dropdown-${msgId}`) d.style.display = 'none';
            });
            const menu = document.getElementById(`dropdown-${msgId}`);
            if (menu) menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function editMessage(msgId) {
            const div = document.getElementById(msgId);
            const textSpan = div.querySelector('.msg-text');
            let currentText = textSpan.innerText.replace(' (נערך)', '');
            let newText = prompt('ערוך הודעה:', currentText);
            if (newText !== null && newText.trim() !== '') {
                socket.emit('edit-message', { messageId: msgId, newText: newText.trim() });
            }
            toggleMsgMenu(msgId);
        }

        function deleteMessage(msgId) {
            if (confirm('האם למחוק הודעה זו?')) {
                socket.emit('delete-message', msgId);
            }
            toggleMsgMenu(msgId);
        }

        function showMsgDetails(msgId) {
            const msg = activeMessagesData.find(m => m.id === msgId);
            if (msg && msg.readBy && msg.readBy.length > 0) {
                alert('ההודעה נקראה על ידי:\n• ' + msg.readBy.join('\n• '));
            } else {
                alert('אף אחד עדיין לא קרא את ההודעה.');
            }
            toggleMsgMenu(msgId);
        }

        socket.on('update-data', (data) => {
            globalUsers = data.allUsers;
            globalRooms = data.privateRooms;

            sidebarContent.innerHTML = '';

            if (currentRoomId !== 'public') {
                const backToPublicBtn = document.createElement('button');
                backToPublicBtn.className = 'menu-action-btn';
                backToPublicBtn.style.backgroundColor = '#607d8b';
                backToPublicBtn.innerText = '⬅️ חזרה לצ\'אט הראשי';
                backToPublicBtn.onclick = () => switchToRoom('public', 'צ\'אט קבוצתי');
                sidebarContent.appendChild(backToPublicBtn);
            }

            if (isUserAdmin) {
                sidebarTitle.innerText = "ניהול סודי (הכל)";
                
                const generalBtn = document.createElement('button');
                generalBtn.className = 'menu-action-btn';
                generalBtn.innerText = '💬 חזור לצ\'אט הכללי';
                generalBtn.onclick = () => switchToRoom('public', 'צ\'אט קבוצתי');
                sidebarContent.appendChild(generalBtn);

                const usersTitle = document.createElement('p');
                usersTitle.style.cssText = 'font-weight:bold; margin:10px 0 5px 0; font-size:13px; color:#333;';
                usersTitle.innerText = 'משתמשים בקבוצה:';
                sidebarContent.appendChild(usersTitle);

                globalUsers.forEach(user => {
                    if (user.nickname !== currentNickname) {
                        const item = document.createElement('div');
                        item.className = 'user-mgmt-item';
                        let roleLabel = user.role ? `(${user.role})` : '';
                        let statusHtml = user.online 
                            ? `<span class="online-status">מחובר</span>` 
                            : `<span class="offline-status">נראה: ${user.lastSeen}</span>`;
                        
                        item.innerHTML = `
                            <span style="flex:1;"><strong>${user.nickname}</strong> ${roleLabel}<br>${statusHtml}</span>
                            <div>
                                <button style="background:#0084ff;color:white;border:none;padding:3px 5px;border-radius:3px;cursor:pointer;" onclick="openCreatePrivateRoomModal('${user.nickname}')">💬 צ'אט</button>
                                <button style="background:#4caf50;color:white;border:none;padding:3px 5px;border-radius:3px;cursor:pointer;" onclick="promptRole('${user.id}')">מנהל</button>
                                ${user.online ? `<button style="background:#e53935;color:white;border:none;padding:3px 5px;border-radius:3px;cursor:pointer;" onclick="kickUser('${user.id}')">הסר</button>` : ''}
                            </div>
                        `;
                        sidebarContent.appendChild(item);
                    }
                });

                const roomsTitle = document.createElement('p');
                roomsTitle.style.cssText = 'font-weight:bold; margin:15px 0 5px 0; font-size:13px; color:#333;';
                roomsTitle.innerText = 'כל הצ\'אטים הפרטיים שנפתחו:';
                sidebarContent.appendChild(roomsTitle);

                const roomsKeys = Object.keys(globalRooms);
                if (roomsKeys.length === 0) {
                    const noRooms = document.createElement('p');
                    noRooms.style.cssText = 'font-size:12px; color:#777;';
                    noRooms.innerText = 'עדיין לא נפתחו צ\'אטים פרטיים.';
                    sidebarContent.appendChild(noRooms);
                } else {
                    roomsKeys.forEach(rId => {
                        let room = globalRooms[rId];
                        let item = document.createElement('div');
                        item.className = 'room-item';
                        item.innerHTML = `
                            <span style="flex:1;"><strong>${room.name}</strong><br><small>${room.members.join(', ')}</small></span>
                            <button style="background:#0084ff;color:white;border:none;padding:4px 6px;border-radius:3px;cursor:pointer;" onclick="switchToRoom('${rId}', '${room.name} (צפייה)')">היכנס</button>
                            <button style="background:#e53935;color:white;border:none;padding:4px 6px;border-radius:3px;cursor:pointer;" onclick="deleteRoom('${rId}')">חסום</button>
                        `;
                        sidebarContent.appendChild(item);
                    });
                }

            } else {
                sidebarTitle.innerText = "תפריט קבוצה";

                const privBtn = document.createElement('button');
                privBtn.className = 'menu-action-btn';
                privBtn.innerText = '➕ פתח צ\'אט אישי חדש';
                privBtn.onclick = () => openCreatePrivateRoomModal();
                sidebarContent.appendChild(privBtn);

                const myRooms = Object.keys(globalRooms).filter(rId => globalRooms[rId].members.includes(currentNickname));
                if (myRooms.length > 0) {
                    const myRoomsTitle = document.createElement('p');
                    myRoomsTitle.style.cssText = 'font-weight:bold; margin:10px 0 5px 0; font-size:13px;';
                    myRoomsTitle.innerText = 'הצ\'אטים האישיים שלי:';
                    sidebarContent.appendChild(myRoomsTitle);

                    myRooms.forEach(rId => {
                        let room = globalRooms[rId];
                        let item = document.createElement('div');
                        item.className = 'room-item';
                        item.innerHTML = `
                            <span style="flex:1;">${room.name}</span>
                            <button style="background:#0084ff;color:white;border:none;padding:5px;border-radius:3px;cursor:pointer;" onclick="switchToRoom('${rId}', '${room.name}')">הכנס</button>
                        `;
                        sidebarContent.appendChild(item);
                    });
                }
            }
        });

        function promptRole(targetId) {
            let choice = prompt('הקלד "מנהל" כדי להוסיף תפקיד, או השאר ריק / כתוב "הסרה" כדי להסיר:');
            if (choice !== null) {
                let role = choice.trim() === 'מנהל' ? 'מנהל' : null;
                socket.emit('set-role', { targetId: targetId, role: role });
            }
        }

        function kickUser(targetId) {
            if (confirm('להסיר את המשתמש מהצ\'אט?')) {
                socket.emit('kick-user', targetId);
            }
        }

        function deleteRoom(roomId) {
            if (confirm('האם אתה בטוח שברצונך לחסום ולמחוק את הצ\'אט הזה לצמיתות?')) {
                socket.emit('delete-private-room', roomId);
            }
        }

        function leaveChat() {
            if (confirm('האם אתה בטוח שברצונך לעזוב את הקבוצה?')) {
                localStorage.removeItem('chat_nickname');
                localStorage.removeItem('chat_is_admin');
                window.location.reload();
            }
        }
    </script>
</body>
</html>
